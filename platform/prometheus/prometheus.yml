global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    topology_name: platform
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/recording-rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          component: metrics

  # These platform jobs define the intended scrape layout for Phase 1.
  # Some targets may not expose metrics yet because their service skeletons
  # are still placeholders. Keeping them here makes the observability shape
  # explicit without pretending the implementations already exist.
  - job_name: app-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - app-api:8000
        labels:
          service: app-api
          component: backend

  - job_name: gnmi-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - gnmi-collector:9804
        labels:
          service: gnmi-collector
          component: collector

  - job_name: odl
    metrics_path: /metrics
    static_configs:
      - targets:
          - odl:8181
        labels:
          service: odl
          component: controller

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          service: grafana
          component: observability

  # Postgres metrics should come from an exporter later rather than from the
  # database service itself. This placeholder keeps the expected topology clear.
  # - job_name: postgres-exporter
  #   static_configs:
  #     - targets:
  #         - postgres-exporter:9187
  #       labels:
  #         service: postgres
  #         component: database
