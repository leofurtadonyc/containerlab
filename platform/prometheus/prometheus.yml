global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    topology_name: platform
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml
  - /etc/prometheus/recording-rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          service: prometheus
          component: metrics

  # These are the currently real platform-semantic metrics targets in Phase 2.
  # /metrics must stay cheap (narrow SQL for sync-run gauges, in-memory counters); cold
  # start should not require multi-minute scrapes. scrape_timeout still bounds slow nets/DB.
  # scrape_interval must be strictly greater than scrape_timeout (Prometheus rule).
  - job_name: app-api
    metrics_path: /metrics
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets:
          - app-api:8000
        labels:
          service: app-api
          component: backend

  - job_name: gnmi-collector
    metrics_path: /metrics
    static_configs:
      - targets:
          - gnmi-collector:9804
        labels:
          service: gnmi-collector
          component: collector

  # These future placeholders remain documented here intentionally, but they
  # are not scraped yet because the current platform implementation does not
  # provide a coherent service-specific metrics contract for them.
  # - job_name: odl
