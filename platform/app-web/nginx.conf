server {
    listen 8088;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $app_api_upstream http://app-api:8000;
        proxy_pass $app_api_upstream;
        proxy_http_version 1.1;
        # Default proxy_read_timeout is 60s; slow app-api JSON (cold Postgres, large read-side
        # assemblies) can exceed that and surface as HTTP 504 in the browser. Align with
        # verify-core-runtime.sh CURL_HTTP_MAX_TIME (120s) for large app-api endpoints.
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}