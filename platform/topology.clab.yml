name: platform

# Separate platform topology.
# Labs are deployed independently and integrated over the management plane.
topology:
  nodes:
    odl:
      kind: linux
      image: platform-odl:0.1.0
      ports:
        - "8181:8181" # RESTCONF and northbound API access
        - "8101:8101" # Karaf shell access
      env:
        ODL_ADMIN_PASSWORD: change_me

    prometheus:
      kind: linux
      image: platform-prometheus:0.1.0
      ports:
        - "9090:9090"
      binds:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
        - ./prometheus/rules:/etc/prometheus/rules
        - ./prometheus/recording-rules:/etc/prometheus/recording-rules
        - ./prometheus/data:/prometheus
      env:
        PLATFORM_ENV: dev
        PROMETHEUS_CONFIG_FILE: /etc/prometheus/prometheus.yml
        PROMETHEUS_RULES_DIR: /etc/prometheus/rules
        PROMETHEUS_RECORDING_RULES_DIR: /etc/prometheus/recording-rules
        PROMETHEUS_STORAGE_PATH: /prometheus

    grafana:
      kind: linux
      image: platform-grafana:0.1.0
      ports:
        - "3000:3000"
      binds:
        - ./grafana/provisioning:/etc/grafana/provisioning
        - ./grafana/dashboards:/etc/grafana/dashboards
        - ./grafana/data:/var/lib/grafana
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: change_me
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
        GRAFANA_DASHBOARDS_PATH: /etc/grafana/dashboards
        GRAFANA_DATA_PATH: /var/lib/grafana

    postgres:
      kind: linux
      image: platform-postgres:0.1.0
      ports:
        - "5432:5432"
      binds:
        - ./postgres/init:/docker-entrypoint-initdb.d
        - ./postgres/data:/var/lib/postgresql/data
      env:
        PGDATA: /var/lib/postgresql/data/pgdata
        POSTGRES_DB: platform
        POSTGRES_USER: platform
        POSTGRES_PASSWORD: change_me

    gnmi-collector:
      kind: linux
      image: platform-gnmi-collector:0.1.0
      ports:
        - "9804:9804"
      binds:
        - ./gnmi-collector/configs:/app/configs
      env:
        COLLECTOR_METRICS_PORT: "9804"
        APP_API_URL: http://app-api:8000
        GNMI_CONFIG_PATH: /app/configs/config.example.yaml
        COLLECTOR_GNMI_REQUEST_TIMEOUT_SECONDS: "2" # Bound dead-target gNMI waits below the app-api collector boundary budget.

    app-api:
      kind: linux
      image: platform-app-api:0.1.0
      ports:
        - "8000:8000"
      env:
        API_PORT: "8000"
        DATABASE_URL: postgresql://platform:change_me@postgres:5432/platform
        GNMI_COLLECTOR_TIMEOUT_SECONDS: "3" # Fail fast to explicit persisted fallback when the collector boundary stalls.
        ODL_URL: http://odl:8181
        ODL_USERNAME: admin
        ODL_PASSWORD: change_me
        ODL_TIMEOUT_SECONDS: "3"
        PROMETHEUS_URL: http://prometheus:9090

    app-web:
      kind: linux
      image: platform-app-web:0.1.0
      ports:
        - "8088:8088"

  # No direct links to lab nodes are defined here.
  # The platform is expected to reach lab services over management connectivity.
