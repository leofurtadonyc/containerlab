[project]
name = "platform-app-api"
version = "0.1.0"
description = "Phase 2 read-only backend foundation for the platform app-api service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.4",
  "fastapi==0.135.1",
  "PyYAML==6.0.3",
  "pydantic-settings==2.13.1",
  "psycopg[binary]==3.3.3",
  "sqlalchemy==2.0.48",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
