[project]
name = "platform-gnmi-collector"
version = "0.1.0"
description = "Phase 1 gNMI collector skeleton for the platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic-settings",
  "uvicorn[standard]",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
