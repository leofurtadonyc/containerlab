[project]
name = "platform-gnmi-collector"
version = "0.1.0"
description = "Phase 2 gNMI collector foundation for the platform."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.135.1",
  "pygnmi==0.8.15",
  "pyyaml==6.0.3",
  "pydantic-settings==2.13.1",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
dev = [
  "httpx",
  "pytest",
]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
