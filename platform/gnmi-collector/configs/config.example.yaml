collector:
  mode: phase_2_live_inventory
  metrics_port: 9804
  delivery:
    mode: backend_http_snapshot
    endpoint: http://app-api:8000

inventory:
  subscriptions:
    - name: system-name
      path: /nokia-state:state/system/oper-name
      cadence: poll
    - name: platform-chassis
      path: /nokia-state:state/system/platform
      cadence: poll
    - name: software-version
      path: /nokia-state:state/system/version
      cadence: poll

targets:
  - name: CPE-A1
    vendor: nokia
    role: cpe
    management_address: 172.20.20.101
    port: 57400
    auth:
      username: platform-ro
      password: PlatformReadOnly1!
    insecure: true
    inventory_paths:
      - /nokia-state:state/system/oper-name
      - /nokia-state:state/system/platform
      - /nokia-state:state/system/version
  - name: CPE-A2
