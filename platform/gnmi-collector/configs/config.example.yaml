collector:
  mode: phase_1_inventory_scaffold
  metrics_port: 9804
  delivery:
    mode: backend_http_placeholder
    endpoint: http://app-api:8000

inventory:
  subscriptions:
    - name: system-name
      path: /system/name
      cadence: poll
    - name: platform-chassis
      path: /platform/chassis
      cadence: poll
    - name: software-version
      path: /platform/software-version
      cadence: poll

targets:
  - name: example-nokia-router
    vendor: nokia
    management_address: 192.0.2.10
    port: 57400
    auth:
      username: example-user
      password: change_me
    insecure: true
    inventory_paths:
      - /system/name
      - /platform/chassis
      - /platform/software-version
