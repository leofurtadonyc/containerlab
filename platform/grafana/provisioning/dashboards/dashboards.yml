apiVersion: 1

providers:
  - name: platform-dashboards
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    editable: false
    # Prevent "Save as" / forked copies in the UI from multiplying provisioned dashboards with the same UID.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
