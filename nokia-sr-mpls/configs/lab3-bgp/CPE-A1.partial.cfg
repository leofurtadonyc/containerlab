configure {
    system {
        name "CPE-A1"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    router "Base" {
        autonomous-system 65001
        interface "system" {
            ipv4 {
                primary {
                    address 172.16.255.1
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:a:255::1 {
                    prefix-length 128
                }
            }
        }
        interface "to-PE1" {
            port 1/1/c1/1
            description "To_PE1_1/1/c1/1"
            admin-state enable
        }
        interface "stub-interface" {
            port 1/1/c2/1
            description "Stub_interface"
            ipv4 {
                primary {
                    address 172.16.1.1
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:a:1::1 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        bgp {
            admin-state enable
            router-id 172.16.255.1
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-PE1" {
                description "eBGP_to_PE1"
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.65.255.11" {
                group "EBGP-PE1"
                description "eBGP_to_PE1"
                peer-as 64515
                loop-detect ignore-loop
            }
        }
    }
}