configure {
    system {
        name "P8"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c4 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c6 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c4/1 {
        admin-state enable
    }
    port 1/1/c6/1 {
        admin-state enable
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.8
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::8 {
                    prefix-length 128
                }
            }
        }
        interface "to-P6" {
            port 1/1/c1/1
            description "To_P6_1/1/c1/1"
            ipv4 {
                primary {
                    address 100.65.0.50
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::33 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-PE3" {
            port 1/1/c2/1
            description "To_PE3_1/1/c2/1"
            ipv4 {
                primary {
                    address 100.65.0.61
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::3D {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P7" {
            port 1/1/c3/1
            description "To_P7_1/1/c3/1"
            ipv4 {
                primary {
                    address 100.65.0.54
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::37 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-PE4" {
            port 1/1/c4/1
            description "To_PE4_1/1/c4/1"
            ipv4 {
                primary {
                    address 100.65.0.69
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::45 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-CSC2-PE2" {
            port 1/1/c6/1
            description "To_CSC2-PE2_1/1/c6/1"
            ipv4 {
                primary {
                    address 100.66.1.6
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66:1::6 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P6" {
            }
            interface "to-PE3" {
            }
            interface "to-PE4" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.8
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 8
                    }
                }
                interface "to-P6" {
                    interface-type point-to-point
                }
                interface "to-PE3" {
                    interface-type point-to-point
                }
                interface "to-PE4" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.8
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-CORE" {
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            neighbor "100.65.255.5" {
                group "IBGP-CORE"
                description "iBGP_to_P5"
            }
            neighbor "100.65.255.6" {
                group "IBGP-CORE"
                description "iBGP_to_P6"
            }
            neighbor "100.66.255.11" {
                group "IBGP-CORE"
                description "eBGP_to_CSC2-PE1"
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P6" {
            }
            interface "to-PE3" {
            }
            interface "to-PE4" {
            }            
        }
    }
}