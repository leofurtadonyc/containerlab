configure {
    system {
        name "PE3"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "ContainerLab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }                    
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c4 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c4/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }

        policy-statement "VRF-IMPORT-PE3" {
            entry 10 {
                from {
                    community {
                        expression "[RT-101]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }

        policy-statement "VRF-EXPORT-OSPF" {
            entry 10 {
                from {
                    protocol {
                        name [ospf]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-103"]
                    }
                }
            }
            entry 20 {
                from {
                    protocol {
                        name [direct]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-103"]
                    }
                }
            }
            default-action {
                action-type reject
            }
        }

        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "OSPF-EXPORT-BGP-VPRN10" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }        
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.13
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::13 {
                    prefix-length 128
                }
            }
        }
        interface "to-P8" {
            port 1/1/c2/1
            description "To_P8_1/1/c2/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.62
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::3E {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P7" {
            port 1/1/c4/1
            description "To_P7_1/1/c4/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.58
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::3B {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        ldp {
            admin-state enable
        }        
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.13
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 13
                    }
                }
                interface "to-P8" {
                    interface-type point-to-point
                }
                interface "to-P7" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.13
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-CPE" {
                type external
                local-address "to-CPE-A2"
                family {
                    ipv4 true
                    ipv6 true
                }
            }          
            neighbor "100.65.255.5" {
                group "IBGP-RR"
                description "iBGP_to_P5"
            }
            neighbor "100.65.255.6" {
                group "IBGP-RR"
                description "iBGP_to_P6"
            }
            neighbor "172.16.255.2" {
                group "EBGP-CPE"
                description "eBGP_to_CPE-A2"
                peer-as 65001
            }            
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }            
        }
    }
    service {
        customer "CUST-A" {
            description "Pair A - CPE-A2 side"
            customer-id 100
        }
        pw-template "50" {
            path-mtu 1514
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-A-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-A"
            spoke-sdp 201:20 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
            }
            sap 1/1/c3/1:20 {
                admin-state enable
            }
        }
        ies "CUST-A-INET" {
            admin-state enable
            service-id 70
            customer "CUST-A"
            interface "to-CPE-A2-vlan70" {
                admin-state enable
                sap 1/1/c3/1:70 {
                }
                ipv4 {
                    primary {
                        address 65.65.0.5
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:a::5 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 201 {
            admin-state enable
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.11
            }
        }
        vpls "CUST-A-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-A"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
            }
            sap 1/1/c3/1:40 {
            }
        }
        vpls "CUST-A-EVPN" {
            admin-state enable
            service-id 60
            customer "CUST-A"
            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }
            bgp-evpn {
                evi 60
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c3/1:60 {
            }
        }
        vpls "CUST-A-VPLS-BGPAD" {
            admin-state enable
            description "VLAN50 - VPLS BGP-AD"
            service-id 50
            customer "CUST-A"
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "PE3"
                    id 3
                }
            }
            sap 1/1/c3/1:50 {
            }
        }
        vpls "CUST-A-VPLS-LDP" {
            admin-state enable
            service-id 30
            customer "CUST-A"
            mesh-sdp 201:30 {
            }
            sap 1/1/c3/1:30 {
            }
        }
        vprn "CUST-A-L3VPN" {
            admin-state enable
            description "VLAN10 - L3VPN"
            service-id 10
            customer "CUST-A"
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1013"
                    vrf-target {
                        community "target:64515:103"
                    }
                    vrf-import {
                        policy ["VRF-IMPORT-PE3"]
                    }
                    vrf-export {
                        policy ["VRF-EXPORT-OSPF"]
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            interface "to-CUST-A2-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.16.0.5
                        prefix-length 30
                    }
                }
                sap 1/1/c3/1:10 {
                }
            }
            ospf 0 {
                admin-state enable
                export-policy ["OSPF-EXPORT-BGP-VPRN10"]
                super-backbone true
                area 0.0.0.0 {
                    interface "to-CUST-A2-vlan10" {
                        interface-type point-to-point
                    }
                }
            }
        }
    }
}