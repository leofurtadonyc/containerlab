configure {
    system {
        name "PE3"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c4 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c4/1 {
        admin-state enable
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.13
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::13 {
                    prefix-length 128
                }
            }
        }
        interface "to-P8" {
            port 1/1/c2/1
            description "To_P8_1/1/c2/1"
            ipv4 {
                primary {
                    address 100.65.0.62
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::3E {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P7" {
            port 1/1/c4/1
            description "To_P7_1/1/c4/1"
            ipv4 {
                primary {
                    address 100.65.0.58
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::3B {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.13
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 3
                    }
                }
                interface "to-P8" {
                    interface-type point-to-point
                }
                interface "to-P7" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.13
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-CPE" {
                type external
                local-address "to-CPE-A2"
                family {
                    ipv4 true
                    ipv6 true
                }
            }          
            neighbor "100.65.255.5" {
                group "IBGP-RR"
                description "iBGP_to_P5"
            }
            neighbor "100.65.255.6" {
                group "IBGP-RR"
                description "iBGP_to_P6"
            }
            neighbor "172.16.255.2" {
                group "EBGP-CPE"
                description "eBGP_to_CPE-A2"
                peer-as 65001
            }            
        }
        rsvp {
            admin-state disable
        }
    }
    service {
        customer "CUST-A" {
            customer-id 100
            description "Pair A - CPE-A2 side"
        }

        sdp 201 {
            admin-state enable
            delivery-type mpls
            far-end {
                ip-address 100.65.255.11
            }
            ldp true
            path-mtu 1500
        }

        vprn "CUST-A-L3VPN" {
            service-id 10
            customer "CUST-A"
            admin-state enable
            description "VLAN10 - L3VPN (A pair)"

            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:10"
                    vrf-target {
                        community "target:64515:10"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }

            interface "to-CPE-A2-vlan10" {
                sap 1/1/c3/1:10 {
                }
                ipv4 {
                    primary {
                        address 172.16.0.5
                        prefix-length 30
                    }
                }
                admin-state enable
            }
        }

        epipe "CUST-A-VPWS-LDP" {
            service-id 20
            customer "CUST-A"
            admin-state enable
            sap 1/1/c3/1:20 { }
            spoke-sdp 201:20 { }
        }

        vpls "CUST-A-VPLS-LDP" {
            service-id 30
            customer "CUST-A"
            admin-state enable
            sap 1/1/c3/1:30 { }
            mesh-sdp 201:30 { }
        }

        epipe "CUST-A-VPWS-BGP" {
            service-id 40
            customer "CUST-A"
            admin-state enable
            sap 1/1/c3/1:40 { }

            bgp 1 {
                route-distinguisher "64515:40"
                route-target {
                    export "target:64515:40"
                    import "target:64515:40"
                }
            }

            bgp-evpn {
                evi 40
                local-attachment-circuit "AC-40" {
                    eth-tag 40
                }
                mpls 1 {
                    admin-state enable
                }
            }
        }

        vpls "CUST-A-VPLS-BGPAD" {
            service-id 50
            customer "CUST-A"
            admin-state enable
            sap 1/1/c3/1:50 { }

            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
            }
        }

        vpls "CUST-A-EVPN" {
            service-id 60
            customer "CUST-A"
            admin-state enable
            sap 1/1/c3/1:60 { }

            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }

            bgp-evpn {
                evi 60
                mpls 1 {
                    admin-state enable
                }
            }
        }

        ies "CUST-A-INET" {
            service-id 70
            customer "CUST-A"
            admin-state enable

            interface "to-CPE-A2-vlan70" {
                sap 1/1/c3/1:70 { }
                ipv4 {
                    primary {
                        address 65.65.0.5
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:a::5 {
                        prefix-length 126
                    }
                }
                admin-state enable
            }
        }
    }
}