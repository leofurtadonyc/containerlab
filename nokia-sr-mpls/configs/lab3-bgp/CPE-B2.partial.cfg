configure {
    system {
        name "CPE-B2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "ContainerLab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    policy-options {
        prefix-list "CPE-B2-PREFIXES" {
            prefix 172.17.0.0/16 type through {
                through-length 32
            }
        }
        policy-statement "CPE-B2-LAN-TO-BGP" {
            entry 10 {
                from {
                    prefix-list ["CPE-B2-PREFIXES"]
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
        policy-statement "CPE-B2-PE4-BGP-IMPORT-ALL" {
            entry 10 {
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 65002
        interface "system" {
            ipv4 {
                primary {
                    address 172.17.255.2
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:b:255::2 {
                    prefix-length 128
                }
            }
        }
        interface "vlan10" {
            description "L3VPN PE-link"
            port 1/1/c3/1:10
            ipv4 {
                primary {
                    address 172.17.0.6
                    prefix-length 30
                }
            }
            admin-state enable
        }
        interface "vlan20" {
            description "VPWS-LDP VLAN20"
            port 1/1/c3/1:20
            ipv4 {
                primary {
                    address 192.168.2.2
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan30" {
            description "VPLS-LDP VLAN30"
            port 1/1/c3/1:30
            ipv4 {
                primary {
                    address 192.168.2.68
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan40" {
            description "EVPN-VPWS VLAN40"
            port 1/1/c3/1:40
            ipv4 {
                primary {
                    address 192.168.2.132
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan50" {
            description "VPLS-BGP-AD VLAN50"
            port 1/1/c3/1:50
            ipv4 {
                primary {
                    address 192.168.2.196
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan60" {
            description "EVPN-MPLS VLAN60"
            port 1/1/c3/1:60
            ipv4 {
                primary {
                    address 192.168.5.65
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan70" {
            description "Internet VLAN70"
            port 1/1/c3/1:70
            ipv4 {
                primary {
                    address 65.65.0.14
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:b::6 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "lan" {
            description "LAN"
            loopback
            ipv4 {
                primary {
                    address 172.17.2.1
                    prefix-length 24
                }
            }
            ipv6 {
                address 2001:db8:b:2::1 {
                    prefix-length 126
                }
            }
        }
        bgp {
            admin-state enable
            router-id 172.17.255.2
            group "EBGP-PE4" {
                description "eBGP_to_PE4_over_VLAN10"
                type external
                family {
                    ipv4 true
                }
                import {
                    policy ["CPE-B2-PE4-BGP-IMPORT-ALL"]
                }
                export {
                    policy ["CPE-B2-LAN-TO-BGP"]
                }
            }
            neighbor "172.17.0.5" {
                admin-state enable                
                group "EBGP-PE4"
                description "eBGP_to_PE4_over_VLAN10"
                peer-as 64515
            }
        }
    }
}