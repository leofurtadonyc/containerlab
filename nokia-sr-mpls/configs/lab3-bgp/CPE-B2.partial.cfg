configure {
    system {
        name "CPE-B2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            encap-type dot1q
        }
    }
    router "Base" {
        autonomous-system 65002
        interface "system" {
            ipv4 {
                primary {
                    address 172.17.255.2
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:b:255::2 {
                    prefix-length 128
                }
            }
        }
        interface "to-PE4" {
            port 1/1/c3/1
            description "To_PE4_1/1/c3/1"
            admin-state enable
        }
        interface "vlan10" {
            description "L3VPN PE-link"
            port 1/1/c2/1:10
            ipv4 {
                primary {
                    address 172.17.0.6
                    prefix-length 30
                }
            }
            admin-state enable
        }
        interface "vlan20" {
            description "VPWS-LDP VLAN20"
            port 1/1/c2/1:20
            ipv4 {
                primary {
                    address 192.168.2.2
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan30" {
            description "VPLS-LDP VLAN30"
            port 1/1/c2/1:30
            ipv4 {
                primary {
                    address 192.168.2.68
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan40" {
            description "EVPN-VPWS VLAN40"
            port 1/1/c2/1:40
            ipv4 {
                primary {
                    address 192.168.2.131
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan50" {
            description "VPLS-BGP-AD VLAN50"
            port 1/1/c2/1:50
            ipv4 {
                primary {
                    address 192.168.2.196
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan60" {
            description "EVPN-MPLS VLAN60"
            port 1/1/c2/1:60
            ipv4 {
                primary {
                    address 192.168.5.65
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan70" {
            description "Internet VLAN70"
            port 1/1/c2/1:70
            ipv4 {
                primary {
                    address 65.65.0.14
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:b::6 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "lan" {
            description "LAN"
            loopback
            ipv4 {
                primary {
                    address 172.17.2.1
                    prefix-length 24
                }
            }
            ipv6 {
                address 2001:db8:b:2::1 {
                    prefix-length 126
                }
            }
        }
        bgp {
            admin-state enable
            router-id 172.17.255.2
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-PE4" {
                description "eBGP_to_PE4"
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.65.255.14" {
                group "EBGP-PE4"
                description "eBGP_to_PE4"
                peer-as 64515
            }
        }
    }
}