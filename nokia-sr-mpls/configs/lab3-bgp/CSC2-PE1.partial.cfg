configure {
    system {
        name "CSC2-PE1"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c6 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c6/1 {
        admin-state enable
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 64516
        interface "system" {
            ipv4 {
                primary {
                    address 100.66.255.11
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:66:255::11 {
                    prefix-length 128
                }
            }
        }
        interface "to-CSC2-P1" {
            port 1/1/c2/1
            description "To_CSC2-P1_1/1/c2/1"
            ipv4 {
                primary {
                    address 100.66.0.1
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66::1 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-CSC2-P2" {
            port 1/1/c3/1
            description "To_CSC2-P2_1/1/c3/1"
            ipv4 {
                primary {
                    address 100.66.0.5
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66::5 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P2" {
            port 1/1/c6/1
            description "To_P2_1/1/c6/1"
            ipv4 {
                primary {
                    address 100.66.1.1
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66:1::1 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.66.255.11
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    interface-type point-to-point
                    passive true
                    node-sid {
                        index 23
                    }
                }
                interface "to-CSC2-P1" {
                    interface-type point-to-point
                }
                interface "to-CSC2-P2" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.66.255.11
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-CSC2" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-CORE" {
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-CPE" {
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.66.255.12" {
                group "IBGP-CSC2"
                description "iBGP_to_CSC2-PE2"
            }
            neighbor "100.66.1.2" {
                group "EBGP-CORE"
                description "eBGP_to_P2"
                peer-as 64515
            }
        }
        rsvp {
            admin-state disable
        }
    }
    service {
        customer "CUST-C" {
            customer-id 300
            description "Pair C - CPE-C1 side"
        }

        sdp 612 {
            admin-state enable
            delivery-type mpls
            far-end {
                ip-address 100.66.255.12
            }
            ldp true
            path-mtu 1500
        }

        vprn "CUST-C-L3VPN" {
            service-id 10
            customer "CUST-C"
            admin-state enable
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64516:210"
                    vrf-target {
                        community "target:64516:210"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            interface "to-CPE-C1-vlan10" {
                sap 1/1/c1/1:10 { }
                ipv4 {
                    primary {
                        address 10.30.10.1
                        prefix-length 30
                    }
                }
                admin-state enable
            }
        }

        epipe "CUST-C-VPWS-LDP" {
            service-id 20
            customer "CUST-C"
            admin-state enable
            sap 1/1/c1/1:20 { }
            spoke-sdp 612:220 { }
        }

        vpls "CUST-C-VPLS-LDP" {
            service-id 30
            customer "CUST-C"
            admin-state enable
            sap 1/1/c1/1:30 { }
            mesh-sdp 612:230 { }
        }

        epipe "CUST-C-VPWS-BGP" {
            service-id 40
            customer "CUST-C"
            admin-state enable
            sap 1/1/c1/1:40 { }
            bgp 1 {
                route-distinguisher "64516:40"
                route-target {
                    export "target:64516:40"
                    import "target:64516:40"
                }
            }
            bgp-evpn {
                evi 240
                local-attachment-circuit "AC-240" {
                    eth-tag 40
                }
                mpls 1 {
                    admin-state enable
                }
            }
        }

        vpls "CUST-C-VPLS-BGPAD" {
            service-id 50
            customer "CUST-C"
            admin-state enable
            sap 1/1/c1/1:50 {
            }

            bgp 1 {
                route-distinguisher "64516:50"
                route-target {
                    export "target:64516:50"
                    import "target:64516:50"
                }
            }
        }

        vpls "CUST-C-EVPN" {
            service-id 60
            customer "CUST-C"
            admin-state enable
            sap 1/1/c1/1:60 {
            }

            # For EVPN, simplest is to let EVI auto-derive RD/RT
            bgp 1 {
            }

            bgp-evpn {
                evi 260
                mpls 1 {
                    admin-state enable
                }
            }
        }

        ies "CUST-C-INET" {
            service-id 70
            customer "CUST-C"
            admin-state enable
            interface "to-CPE-C1-vlan70" {
                sap 1/1/c1/1:70 { }
                ipv4 {
                    primary {
                        address 172.18.170.1
                        prefix-length 30
                    }
                }
                admin-state enable
            }
        }
    }
}
