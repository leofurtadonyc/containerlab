configure {
    system {
        name "PE1"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }

    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }

    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }

    # Customer-facing handoff (multi-service over VLANs)
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }

    # Core-facing ports
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }

    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }

        policy-statement "VRF-IMPORT-PE1" {
            entry 10 {
                from {
                    community {
                        expression "[RT-102] OR [RT-103]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }

        policy-statement "VRF-EXPORT-OSPF" {
            entry 10 {
                from {
                    protocol {
                        name [ospf]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-101"]
                    }
                }
            }
            entry 20 {
                from {
                    protocol {
                        name [direct]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-101"]
                    }
                }
            }
            default-action {
                action-type reject
            }
        } 
        
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }

        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }

        policy-statement "OSPF-EXPORT-BGP-VPRN10" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }        
    }

    router "Base" {
        autonomous-system 64515

        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.11
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::11 {
                    prefix-length 128
                }
            }
        }

        # NOTE: customer port 1/1/c1/1 is now service-facing (SAPs), so no Base interface here

        interface "to-P2" {
            port 1/1/c2/1
            description "To_P2_1/1/c2/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.5
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::5 {
                    prefix-length 126
                }
            }
            admin-state enable
        }

        interface "to-P1" {
            port 1/1/c3/1
            description "To_P1_1/1/c3/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.1
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::1 {
                    prefix-length 126
                }
            }
            admin-state enable
        }

        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }

        ldp {
            admin-state enable
        }

        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P1" {
            }
            interface "to-P2" {
            }
        }

        ospf 0 {
            admin-state enable
            router-id 100.65.255.11
            advertise-router-capability area
            traffic-engineering true

            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }

            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 11
                    }
                }
                interface "to-P2" {
                    interface-type point-to-point
                }
                interface "to-P1" {
                    interface-type point-to-point
                }
            }
        }

        bgp {
            admin-state enable
            router-id 100.65.255.11
            rapid-withdrawal true

            graceful-restart {
            }

            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }

            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }

            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"

                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }

            neighbor "100.65.255.3" {
                group "IBGP-RR"
                description "iBGP_to_P3"
            }
            neighbor "100.65.255.4" {
                group "IBGP-RR"
                description "iBGP_to_P4"
            }
        }

        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P2" {
            }
            interface "to-P1" {
            }            
        }
    }
    
    service {
        customer "CUST-A" {
            description "Customer A multi-service VLAN handoff"
            customer-id 100
        }
        pw-template "50" {
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-A-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-A"
            spoke-sdp 200:20 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
            }
            sap 1/1/c1/1:20 {
                admin-state enable
            }
        }
        ies "CUST-A-INET" {
            admin-state enable
            description "VLAN70 - Internet Access"
            service-id 70
            customer "CUST-A"
            interface "to-CUST-A-vlan70" {
                admin-state enable
                sap 1/1/c1/1:70 {
                }
                ipv4 {
                    primary {
                        address 65.65.0.1
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:a::1 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 200 {
            admin-state enable
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.13
            }
        }
        vpls "CUST-A-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-A"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
            }
            sap 1/1/c1/1:40 {
            }
        }
        vpls "CUST-A-EVPN" {
            admin-state enable
            description "VLAN60 - EVPN MPLS/SR"
            service-id 60
            customer "CUST-A"
            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }
            bgp-evpn {
                evi 60
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c1/1:60 {
            }
        }
        vpls "CUST-A-VPLS-BGPAD" {
            admin-state enable
            description "VLAN50 - VPLS BGP-AD"
            service-id 50
            customer "CUST-A"
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "PE1"
                    id 1
                }
            }
            sap 1/1/c1/1:50 {
            }
        }
        vpls "CUST-A-VPLS-LDP" {
            admin-state enable
            description "VLAN30 - VPLS LDP"
            service-id 30
            customer "CUST-A"
            mesh-sdp 200:30 {
            }
            sap 1/1/c1/1:30 {
            }
        }
        vprn "CUST-A-L3VPN" {
            admin-state enable
            description "VLAN10 - L3VPN"
            service-id 10
            customer "CUST-A"
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1011"
                    vrf-target {
                        community "target:64515:101"
                    }
                    vrf-import {
                        policy ["VRF-IMPORT-PE1"]
                    }
                    vrf-export {
                        policy ["VRF-EXPORT-OSPF"]
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            interface "to-CUST-A1-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.16.0.2
                        prefix-length 30
                    }
                }
                sap 1/1/c1/1:10 {
                }
            }
            ospf 0 {
                admin-state enable
                export-policy ["OSPF-EXPORT-BGP-VPRN10"]
                super-backbone true
                area 0.0.0.0 {
                    interface "to-CUST-A1-vlan10" {
                        interface-type point-to-point
                    }
                }
            }
        }
    }
}