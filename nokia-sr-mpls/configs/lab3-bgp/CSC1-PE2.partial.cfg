configure {
    system {
        name "CSC1-PE2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "ContainerLab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c6 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
    }
    port 1/1/c2/1 {
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c6/1 {
        admin-state enable
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 64513
        interface "system" {
            ipv4 {
                primary {
                    address 100.64.255.12
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:64:255::12 {
                    prefix-length 128
                }
            }
        }
        interface "to-ISP2-R1" {
            port 1/1/c1/1
            description "To_ISP2-R1_1/1/c1/1"
            ipv4 {
                primary {
                    address 203.0.113.2
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:2::2 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-CSC1-P3" {
            port 1/1/c2/1
            description "To_CSC1-P3_1/1/c2/1"
            ipv4 {
                primary {
                    address 100.64.0.18
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64::12 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-CSC1-P4" {
            port 1/1/c3/1
            description "To_CSC1-P4_1/1/c3/1"
            ipv4 {
                primary {
                    address 100.64.0.22
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64::15 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P7" {
            port 1/1/c6/1
            description "To_P7_1/1/c6/1"
            ipv4 {
                primary {
                    address 100.64.1.5
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64:1::5 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-CSC1-P3" {
            }
            interface "to-CSC1-P4" {
            }            
        }
        ospf 0 {
            admin-state enable
            router-id 100.64.255.12
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 212
                    }
                }
                interface "to-CSC1-P3" {
                    interface-type point-to-point
                }
                interface "to-CSC1-P4" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.64.255.12
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-CSC1" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-ISP" {
                next-hop-self true
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            group "EBGP-CORE" {
                next-hop-self true
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            neighbor "100.64.255.11" {
                group "IBGP-CSC1"
                description "iBGP_to_CSC1-PE1"
            }
            neighbor "203.0.113.1" {
                group "EBGP-ISP"
                description "eBGP_to_ISP2-R1"
                peer-as 64514
            }
            neighbor "100.64.1.6" {
                group "EBGP-CORE"
                description "eBGP_to_P7"
                peer-as 64515
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-CSC1-P3" {
            }
            interface "to-CSC1-P4" {
            }
        }
    }
}