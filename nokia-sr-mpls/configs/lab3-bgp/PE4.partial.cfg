configure {
    system {
        name "PE4"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "ContainerLab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }

                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c4 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c5 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }        
    }
    port 1/1/c4/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }        
    }
    port 1/1/c5/1 {
        admin-state enable
    }
    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }
        policy-statement "BGP-EXPORT-VPRN10-TO-CE" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "BGP-IMPORT-VPRN10-FROM-CE" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "VRF-EXPORT-CE-BGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-104"]
                    }
                }
            }
            default-action {
                action-type reject
            }
        }
        policy-statement "VRF-IMPORT-PE4" {
            entry 10 {
                from {
                    community {
                        expression "[RT-102]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }        
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.14
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::14 {
                    prefix-length 128
                }
            }
        }
        interface "to-P7" {
            port 1/1/c2/1
            description "To_P7_1/1/c2/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.66
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::42 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P8" {
            port 1/1/c4/1
            description "To_P8_1/1/c4/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.70
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::47 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-NOC-R2" {
            port 1/1/c5/1
            description "To_NOC-R2_1/1/c5/1"
            ipv4 {
                primary {
                    address 100.65.0.77
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::4D {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        ldp {
            admin-state enable
        }        
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.14
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 14
                    }
                }
                interface "to-P7" {
                    interface-type point-to-point
                }
                interface "to-P8" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.14
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            neighbor "100.65.255.5" {
                group "IBGP-RR"
                description "iBGP_to_P5"
            }
            neighbor "100.65.255.6" {
                group "IBGP-RR"
                description "iBGP_to_P6"
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }            
        }
    }
    service {
        customer "CUST-B" {
            description "Pair B - CPE-B2 side"
            customer-id 200
        }
        pw-template "50" {
            path-mtu 1514
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-B-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-B"
            spoke-sdp 202:20 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
            }
            sap 1/1/c3/1:20 {
                admin-state enable
            }
        }
        ies "CUST-B-INET" {
            admin-state enable
            service-id 70
            customer "CUST-B"
            interface "to-CPE-B2-vlan70" {
                admin-state enable
                sap 1/1/c3/1:70 {
                }
                ipv4 {
                    primary {
                        address 65.65.0.13
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:b::5 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 202 {
            admin-state enable
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.12
            }
        }
        vpls "CUST-B-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-B"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
            }
            sap 1/1/c3/1:40 {
            }
        }
        vpls "CUST-B-EVPN" {
            admin-state enable
            service-id 60
            customer "CUST-B"
            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }
            bgp-evpn {
                evi 160
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c3/1:60 {
            }
        }
        vpls "CUST-B-VPLS-BGPAD" {
            admin-state enable
            description "VLAN50 - VPLS BGP-AD"
            service-id 50
            customer "CUST-B"
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "PE4"
                    id 4
                }
            }
            sap 1/1/c3/1:50 {
            }
        }
        vpls "CUST-B-VPLS-LDP" {
            admin-state enable
            service-id 30
            customer "CUST-B"
            mesh-sdp 202:130 {
            }
            sap 1/1/c3/1:30 {
            }
        }
        vprn "CUST-B-L3VPN" {
            admin-state enable
            service-id 10
            customer "CUST-B"
            autonomous-system 64515
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1014"
                    vrf-target {
                        community "target:64515:104"
                    }
                    vrf-import {
                        policy ["VRF-IMPORT-PE4"]
                    }
                    vrf-export {
                        policy ["VRF-EXPORT-CE-BGP"]
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            bgp {
                admin-state enable
                router-id 100.65.255.14
                group "CE-B2" {
                    admin-state enable
                    as-override true
                    type external
                    peer-as 65002
                    local-address 172.17.0.5
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["BGP-IMPORT-VPRN10-FROM-CE"]
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN10-TO-CE"]
                    }
                }
                neighbor "172.17.0.6" {
                    admin-state enable
                    group "CE-B2"
                    peer-as 65002
                }
            }
            interface "to-CPE-B2-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.17.0.5
                        prefix-length 30
                    }
                }
                sap 1/1/c3/1:10 {
                }
            }
        }
    }
}