configure {
    system {
        name "CPE-C2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    router "Base" {
        autonomous-system 65003
        interface "system" {
            ipv4 {
                primary {
                    address 172.18.255.2
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:c:255::2 {
                    prefix-length 128
                }
            }
        }
        interface "vlan10" {
            description "L3VPN PE-link"
            port 1/1/c1/1:10
            ipv4 {
                primary {
                    address 172.18.0.6
                    prefix-length 30
                }
            }
            admin-state enable
        }
        interface "vlan20" {
            description "VPWS-LDP VLAN20"
            port 1/1/c1/1:20
            ipv4 {
                primary {
                    address 192.168.3.2
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan30" {
            description "VPLS-LDP VLAN30"
            port 1/1/c1/1:30
            ipv4 {
                primary {
                    address 192.168.3.66
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan40" {
            description "EVPN-VPWS VLAN40"
            port 1/1/c1/1:40
            ipv4 {
                primary {
                    address 192.168.3.130
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan50" {
            description "VPLS-BGP-AD VLAN50"
            port 1/1/c1/1:50
            ipv4 {
                primary {
                    address 192.168.3.194
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan60" {
            description "EVPN-MPLS VLAN60"
            port 1/1/c1/1:60
            ipv4 {
                primary {
                    address 192.168.6.65
                    prefix-length 26
                }
            }
            admin-state enable
        }
        interface "vlan70" {
            description "Internet VLAN70"
            port 1/1/c1/1:70
            ipv4 {
                primary {
                    address 66.66.0.6
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:c::6 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "lan" {
            description "LAN"
            loopback
            ipv4 {
                primary {
                    address 172.18.2.1
                    prefix-length 24
                }
            }
            ipv6 {
                address 2001:db8:c:2::1 {
                    prefix-length 126
                }
            }
        }
        bgp {
            admin-state enable
            router-id 172.18.255.2
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-CSC2-PE2" {
                description "eBGP_to_CSC2-PE2"
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.66.255.12" {
                group "EBGP-CSC2-PE2"
                description "eBGP_to_CSC2-PE2"
                peer-as 64516
            }
        }
    }
}
