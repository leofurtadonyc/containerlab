configure {
    system {
        name "P4"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c4 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c5 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
    }
    port 1/1/c4/1 {
        admin-state enable
    }
    port 1/1/c5/1 {
        admin-state enable
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.4
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::4 {
                    prefix-length 128
                }
            }
        }
        interface "to-P3" {
            port 1/1/c3/1
            description "To_P3_1/1/c3/1"
            ipv4 {
                primary {
                    address 100.65.0.30
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::1F {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P6" {
            port 1/1/c4/1
            description "To_P6_1/1/c4/1"
            ipv4 {
                primary {
                    address 100.65.0.37
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::25 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P2" {
            port 1/1/c5/1
            description "To_P2_1/1/c5/1"
            ipv4 {
                primary {
                    address 100.65.0.26
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::1A {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.4
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    interface-type point-to-point
                    passive true
                    node-sid {
                        index 14
                    }
                }
                interface "to-P3" {
                    interface-type point-to-point
                }
                interface "to-P6" {
                    interface-type point-to-point
                }
                interface "to-P2" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.4
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-CLIENTS-FULL" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                cluster {
                    cluster-id 100.65.255.4
                }
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-te-ipv4 true
                    sr-te-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "IBGP-CLIENTS-TRANS" {
                next-hop-self true
                type internal
                local-address "system"
                cluster {
                    cluster-id 100.65.255.4
                }
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    sr-te-ipv4 true
                    sr-te-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            neighbor "100.65.255.11" {
                group "IBGP-CLIENTS-FULL"
                description "iBGP_to_PE1"
            }
            neighbor "100.65.255.12" {
                group "IBGP-CLIENTS-FULL"
                description "iBGP_to_PE2"
            }
            neighbor "100.65.255.3" {
                group "IBGP-CLIENTS-FULL"
                description "iBGP_to_P3"
            }
            neighbor "100.65.255.5" {
                group "IBGP-CLIENTS-FULL"
                description "iBGP_to_P5"
            }
            neighbor "100.65.255.6" {
                group "IBGP-CLIENTS-FULL"
                description "iBGP_to_P6"
            }
            neighbor "100.65.255.1" {
                group "IBGP-CLIENTS-TRANS"
                description "iBGP_to_P1"
            }
            neighbor "100.65.255.2" {
                group "IBGP-CLIENTS-TRANS"
                description "iBGP_to_P2"
            }
        }
        rsvp {
            admin-state disable
        }
    }
}