configure {
    system {
        name "CPE-A2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    router "Base" {
        autonomous-system 65001
        interface "system" {
            ipv4 {
                primary {
                    address 172.16.255.2
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:a:255::2 {
                    prefix-length 128
                }
            }
        }
        interface "to-PE3" {
            port 1/1/c3/1
            description "To_PE3_1/1/c3/1"
            admin-state enable
        }
        bgp {
            admin-state enable
            router-id 172.16.255.2
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-PE3" {
                description "eBGP_to_PE3"
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.65.255.13" {
                group "EBGP-PE3"
                description "eBGP_to_PE3"
                peer-as 64515
                loop-detect ignore-loop
            }
        }
    }
    service {
        customer "1" {
        }
        vprn 10 {
            admin-state enable
            customer "1"
            description "L3VPN VLAN10"
            interface "vlan10-pe-link" {
                ipv4 {
                    primary {
                        address 172.16.0.6
                        prefix-length 30
                    }
                }
                sap 1/1/c2/1:10 {
                    admin-state enable
                }
            }
            interface "vlan10-lan" {
                loopback
                ipv4 {
                    primary {
                        address 172.16.2.1
                        prefix-length 24
                    }
                }
                ipv6 {
                    address 2001:db8:a:2::1 {
                        prefix-length 64
                    }
                }
            }
        }
        epipe 20 {
            admin-state enable
            customer "1"
            description "VPWS-LDP VLAN20 CE-IP:192.168.1.2/26"
            sap 1/1/c2/1:20 {
                admin-state enable
            }
        }
        vpls 30 {
            admin-state enable
            customer "1"
            description "VPLS-LDP VLAN30 CE-IP:192.168.1.66/26"
            sap 1/1/c2/1:30 {
                admin-state enable
            }
        }
        epipe 40 {
            admin-state enable
            customer "1"
            description "EVPN-VPWS VLAN40 CE-IP:192.168.2.130/26"
            sap 1/1/c2/1:40 {
                admin-state enable
            }
        }
        vpls 50 {
            admin-state enable
            customer "1"
            description "VPLS-BGP-AD VLAN50 CE-IP:192.168.2.194/26"
            sap 1/1/c2/1:50 {
                admin-state enable
            }
        }
        epipe 60 {
            admin-state enable
            customer "1"
            description "EVPN-MPLS VLAN60 CE-IP:192.168.4.65/26"
            sap 1/1/c2/1:60 {
                admin-state enable
            }
        }
        ies 70 {
            admin-state enable
            customer "1"
            description "IES-Internet VLAN70"
            interface "vlan70-inet" {
                ipv4 {
                    primary {
                        address 65.65.0.6
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:a::6 {
                        prefix-length 126
                    }
                }
                sap 1/1/c2/1:70 {
                    admin-state enable
                }
            }
        }
    }
}