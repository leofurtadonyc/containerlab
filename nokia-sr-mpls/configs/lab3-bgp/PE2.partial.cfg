configure {
    system {
        name "PE2"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c3 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c5 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }        
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c5/1 {
        admin-state enable
    }
    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }

        policy-statement "VRF-IMPORT-PE2" {
            entry 10 {
                from {
                    community {
                        expression "[RT-101] OR [RT-104]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }

        policy-statement "VRF-EXPORT-CE-BGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }

        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "BGP-EXPORT-VPRN10-TO-CE" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }        
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.12
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::12 {
                    prefix-length 128
                }
            }
        }
        interface "to-P1" {
            port 1/1/c2/1
            description "To_P1_1/1/c2/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.9
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::9 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-P2" {
            port 1/1/c3/1
            description "To_P2_1/1/c3/1"
            ip-mtu 9000
            ipv4 {
                primary {
                    address 100.65.0.13
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::13 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        interface "to-NOC-R1" {
            port 1/1/c5/1
            description "To_NOC-R1_1/1/c5/1"
            ipv4 {
                primary {
                    address 100.65.0.73
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::49 {
                    prefix-length 126
                }
            }
            admin-state enable
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        ldp {
            admin-state enable
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P1" {
            }
            interface "to-P2" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.12
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 12
                    }
                }
                interface "to-P1" {
                    interface-type point-to-point
                }
                interface "to-P2" {
                    interface-type point-to-point
                }
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.12
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    vpn-ipv4 true
                    vpn-ipv6 true
                    evpn true
                    l2-vpn true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                    bgp-ls true
                    flow-ipv4 true
                    flow-ipv6 true
                }
            }
            group "EBGP-CPE" {
                type external
                local-address "to-CPE-B1"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.65.255.3" {
                group "IBGP-RR"
                description "iBGP_to_P3"
            }
            neighbor "100.65.255.4" {
                group "IBGP-RR"
                description "iBGP_to_P4"
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P1" {
            }
            interface "to-P2" {
            }
        }
    }
    service {
        customer "CUST-B" {
            customer-id 200
            description "Pair B - CPE-B1 side"
        }

        sdp 204 {
            admin-state enable
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.14
            }
        }

        vprn "CUST-B-L3VPN" {
            service-id 10
            customer "CUST-B"
            admin-state enable

        bgp-ipvpn {
            mpls {
                admin-state enable
                route-distinguisher "64515:1012"
                vrf-target {
                    community "target:64515:102"
                }
                vrf-import {
                    policy ["VRF-IMPORT-PE2"]
                }
                vrf-export {
                    policy ["VRF-EXPORT-CE-BGP"]
                }
                auto-bind-tunnel {
                    resolution filter
                    resolution-filter {
                        ldp true
                        sr-ospf true
                    }
                }
            }
        }

            interface "to-CPE-B1-vlan10" {
                sap 1/1/c1/1:10 { }
                ipv4 {
                    primary {
                        address 172.17.0.2
                        prefix-length 30
                    }
                }
                admin-state enable
            }

            bgp {
                admin-state enable
                group "CE-B1" {
                    type external
                    family {
                        ipv4 true
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN10-TO-CE"]
                    }
                    peer-as 65021
                }
                neighbor "172.17.0.1" {
                    group "CE-B1"
                }
            }
        }

        epipe "CUST-B-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-B"
            spoke-sdp 204:20 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
            }
            sap 1/1/c1/1:20 {
                admin-state enable
            }
        }

        vpls "CUST-B-VPLS-LDP" {
            service-id 30
            customer "CUST-B"
            admin-state enable
            sap 1/1/c1/1:30 { }
            mesh-sdp 204:130 { }
        }

        vpls "CUST-B-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-B"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
            }
            sap 1/1/c1/1:40 {
            }
        }

        vpls "CUST-B-VPLS-BGPAD" {
            service-id 50
            customer "CUST-B"
            admin-state enable
            sap 1/1/c1/1:50 { }

            bgp 1 {
                    route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
            }
        }

        vpls "CUST-B-EVPN" {
            service-id 60
            customer "CUST-B"
            admin-state enable
            sap 1/1/c1/1:60 { }

            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }

            bgp-evpn {
                evi 160
                mpls 1 {
                    admin-state enable
                }
            }
        }

        ies "CUST-B-INET" {
            service-id 70
            customer "CUST-B"
            admin-state enable

            interface "to-CPE-B1-vlan70" {
                sap 1/1/c1/1:70 { }
                ipv4 {
                    primary {
                        address 65.65.0.9
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:b::1 {
                        prefix-length 126
                    }
                }
                admin-state enable
            }
        }
    }
}