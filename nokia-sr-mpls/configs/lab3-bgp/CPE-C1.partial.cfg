configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    policy-options {
        prefix-list "CPE-C1-PREFIXES" {
            prefix 172.18.0.0/16 type through {
                through-length 32
            }
        }
        policy-statement "CPE-C1-CSC2-PE1-BGP-IMPORT-ALL" {
            entry 10 {
                action {
                    action-type accept
                }
            }
        }
        policy-statement "CPE-C1-LAN-TO-BGP" {
            entry 10 {
                from {
                    prefix-list ["CPE-C1-PREFIXES"]
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
            encap-type dot1q
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    router "Base" {
        autonomous-system 65003
        interface "lan" {
            description "LAN"
            loopback
            ipv4 {
                primary {
                    address 172.18.1.1
                    prefix-length 24
                }
            }
            ipv6 {
                address 2001:db8:c:1::1 {
                    prefix-length 126
                }
            }
        }
        interface "system" {
            ipv4 {
                primary {
                    address 172.18.255.1
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:c:255::1 {
                    prefix-length 128
                }
            }
        }
        interface "vlan10" {
            admin-state enable
            description "L3VPN PE-link"
            port 1/1/c1/1:10
            ipv4 {
                primary {
                    address 172.18.0.2
                    prefix-length 30
                }
            }
        }
        interface "vlan20" {
            admin-state enable
            description "VPWS-LDP VLAN20"
            port 1/1/c1/1:20
            ipv4 {
                primary {
                    address 192.168.3.1
                    prefix-length 26
                }
            }
        }
        interface "vlan30" {
            admin-state enable
            description "VPLS-LDP VLAN30"
            port 1/1/c1/1:30
            ipv4 {
                primary {
                    address 192.168.3.65
                    prefix-length 26
                }
            }
        }
        interface "vlan40" {
            admin-state enable
            description "EVPN-VPWS VLAN40"
            port 1/1/c1/1:40
            ipv4 {
                primary {
                    address 192.168.3.129
                    prefix-length 26
                }
            }
        }
        interface "vlan50" {
            admin-state enable
            description "VPLS-BGP-AD VLAN50"
            port 1/1/c1/1:50
            ipv4 {
                primary {
                    address 192.168.3.193
                    prefix-length 26
                }
            }
        }
        interface "vlan60" {
            admin-state enable
            description "EVPN-MPLS VLAN60"
            port 1/1/c1/1:60
            ipv4 {
                primary {
                    address 192.168.6.1
                    prefix-length 26
                }
            }
        }
        interface "vlan70" {
            admin-state enable
            description "Internet VLAN70"
            port 1/1/c1/1:70
            ipv4 {
                primary {
                    address 66.66.0.2
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:c::2 {
                    prefix-length 126
                }
            }
        }
        bgp {
            admin-state enable
            router-id 172.18.255.1
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-CSC2-PE1-VLAN10" {
                description "eBGP_to_CSC2-PE1_over_VLAN10"
                type external
                local-address 172.18.0.2
                family {
                    ipv4 true
                }
                import {
                    policy ["CPE-C1-CSC2-PE1-BGP-IMPORT-ALL"]
                }
                export {
                    policy ["CPE-C1-LAN-TO-BGP"]
                }
            }
            neighbor "172.18.0.1" {
                description "eBGP_to_CSC2-PE1_over_VLAN10"
                group "EBGP-CSC2-PE1-VLAN10"
                peer-as 64516
            }
        }
    }
    system {
        name "CPE-C1"
        grpc {
            admin-state enable
            allow-unsecure-connection
            gnmi {
                admin-state enable
                auto-config-save true
            }
            gnoi {
                cert-mgmt {
                    admin-state enable
                }
                file {
                    admin-state enable
                }
                system {
                    admin-state enable
                }
            }
            md-cli {
                admin-state enable
            }
            rib-api {
                admin-state enable
            }
        }
        management-interface {
            netconf {
                auto-config-save true
                listen {
                    admin-state enable
                }
            }
            snmp {
                packet-size 9216
                streaming {
                    admin-state enable
                }
            }
        }
        login-control {
            login-banner true
            pre-login-message {
                message "................................................................\n:                  Welcome to Nokia SR OS!                     :\n:                                                              :\n:                                                              :\n: YANG:          https://yang.labctl.net/                      :\n: Community:     https://containerlab.dev/community/           :\n: Discord:       https://containerlab.dev/discord/             :\n................................................................\n"
            }
        }
        security {
            aaa {
                local-profiles {
                    profile "administrative" {
                        default-action permit-all
                        entry 10 {
                            match "configure system security"
                            action permit
                        }
                        entry 20 {
                            match "show system security"
                            action permit
                        }
                        entry 30 {
                            match "tools perform security"
                            action permit
                        }
                        entry 40 {
                            match "tools dump security"
                            action permit
                        }
                        entry 42 {
                            match "tools dump system security"
                            action permit
                        }
                        entry 50 {
                            match "admin system security"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                        entry 110 {
                            match "show li"
                            action deny
                        }
                        entry 111 {
                            match "clear li"
                            action deny
                        }
                        entry 112 {
                            match "tools dump li"
                            action deny
                        }
                        entry 113 {
                            match "tools perform system security"
                            action permit
                        }
                        grpc {
                            rpc-authorization {
                                gnmi-capabilities permit
                                gnmi-get permit
                                gnmi-set permit
                                gnmi-subscribe permit
                                gnoi-cert-mgmt-rotate permit
                                gnoi-cert-mgmt-install permit
                                gnoi-cert-mgmt-getcert permit
                                gnoi-cert-mgmt-revoke permit
                                gnoi-cert-mgmt-cangenerate permit
                                gnoi-file-get permit
                                gnoi-file-transfertoremote permit
                                gnoi-file-put permit
                                gnoi-file-stat permit
                                gnoi-file-remove permit
                                gnoi-system-ping permit
                                gnoi-system-traceroute permit
                                gnoi-system-time permit
                                gnoi-system-setpackage permit
                                gnoi-system-switchcontrolprocessor permit
                                gnoi-system-reboot permit
                                gnoi-system-rebootstatus permit
                                gnoi-system-cancelreboot permit
                                md-cli-session permit
                                rib-api-getversion permit
                                rib-api-modify permit
                            }
                        }
                        netconf {
                            base-op-authorization {
                                action true
                                cancel-commit true
                                close-session true
                                commit true
                                copy-config true
                                create-subscription true
                                delete-config true
                                discard-changes true
                                edit-config true
                                get true
                                get-config true
                                get-data true
                                get-schema true
                                kill-session true
                                lock true
                                validate true
                            }
                        }
                    }
                    profile "default" {
                        entry 10 {
                            match "exec"
                            action permit
                        }
                        entry 20 {
                            match "exit"
                            action permit
                        }
                        entry 30 {
                            match "help"
                            action permit
                        }
                        entry 40 {
                            match "logout"
                            action permit
                        }
                        entry 50 {
                            match "password"
                            action permit
                        }
                        entry 60 {
                            match "show config"
                            action deny
                        }
                        entry 65 {
                            match "show li"
                            action deny
                        }
                        entry 66 {
                            match "clear li"
                            action deny
                        }
                        entry 67 {
                            match "tools dump li"
                            action deny
                        }
                        entry 68 {
                            match "state li"
                            action deny
                        }
                        entry 70 {
                            match "show"
                            action permit
                        }
                        entry 75 {
                            match "state"
                            action permit
                        }
                        entry 80 {
                            match "enable-admin"
                            action permit
                        }
                        entry 90 {
                            match "enable"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                    }
                }
            }
            snmp {
                community "76HzdddhlPpRo1Vql+ZB5spLqccgYQ== hash2" {
                    access-permissions r
                    version v2c
                }
            }
            ssh {
                server-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                client-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                server-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
                client-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
            }
            user-params {
                attempts {
                    count 64
                }
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        restricted-to-home false
                        access {
                            console true
                            netconf true
                            grpc true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "Containerlab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
