configure {
    system {
        name "CPE-B1"
        security {
            user-params {
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    port 1/1/c1 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c2 {
        connector {
            breakout c1-100g
        }
        admin-state enable
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    router "Base" {
        autonomous-system 65002
        interface "system" {
            ipv4 {
                primary {
                    address 172.17.255.1
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:b:255::1 {
                    prefix-length 128
                }
            }
        }
        interface "to-PE2" {
            port 1/1/c1/1
            description "To_PE2_1/1/c1/1"
            admin-state enable
        }
        bgp {
            admin-state enable
            router-id 172.17.255.1
            rapid-withdrawal true
            graceful-restart {
            }
            group "EBGP-PE2" {
                description "eBGP_to_PE2"
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            neighbor "100.65.255.12" {
                group "EBGP-PE2"
                description "eBGP_to_PE2"
                peer-as 64515
            }
        }
    }
    service {
        customer "1" {
        }
        vprn 10 {
            admin-state enable
            customer "1"
            description "L3VPN VLAN10"
            interface "vlan10-pe-link" {
                ipv4 {
                    primary {
                        address 172.17.0.1
                        prefix-length 30
                    }
                }
                sap 1/1/c2/1:10 {
                    admin-state enable
                }
            }
            interface "vlan10-lan" {
                loopback
                ipv4 {
                    primary {
                        address 172.17.1.1
                        prefix-length 24
                    }
                }
                ipv6 {
                    address 2001:db8:b:1::1 {
                        prefix-length 126
                    }
                }
            }
        }
        epipe 20 {
            admin-state enable
            customer "1"
            description "VPWS-LDP VLAN20 CE-IP:192.168.2.1/26"
            sap 1/1/c2/1:20 {
                admin-state enable
            }
        }
        vpls 30 {
            admin-state enable
            customer "1"
            description "VPLS-LDP VLAN30 CE-IP:192.168.2.67/26"
            sap 1/1/c2/1:30 {
                admin-state enable
            }
        }
        epipe 40 {
            admin-state enable
            customer "1"
            description "EVPN-VPWS VLAN40 CE-IP:192.168.2.131/26"
            sap 1/1/c2/1:40 {
                admin-state enable
            }
        }
        vpls 50 {
            admin-state enable
            customer "1"
            description "VPLS-BGP-AD VLAN50 CE-IP:192.168.2.195/26"
            sap 1/1/c2/1:50 {
                admin-state enable
            }
        }
        epipe 60 {
            admin-state enable
            customer "1"
            description "EVPN-MPLS VLAN60 CE-IP:192.168.5.1/26"
            sap 1/1/c2/1:60 {
                admin-state enable
            }
        }
        ies 70 {
            admin-state enable
            customer "1"
            description "IES-Internet VLAN70"
            interface "vlan70-inet" {
                ipv4 {
                    primary {
                        address 65.65.0.10
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:b::2 {
                        prefix-length 126
                    }
                }
                sap 1/1/c2/1:70 {
                    admin-state enable
                }
            }
        }
    }
}