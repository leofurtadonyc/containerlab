configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "OSPF-EXPORT-BGP-VPRN10" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "VRF-EXPORT-OSPF" {
            entry 10 {
                from {
                    protocol {
                        name [ospf]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-101"]
                    }
                }
            }
            entry 20 {
                from {
                    protocol {
                        name [direct]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-101"]
                    }
                }
            }
            default-action {
                action-type reject
            }
        }
        policy-statement "VRF-IMPORT-PE1" {
            entry 10 {
                from {
                    community {
                        expression "[RT-102] OR [RT-103]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        description "type=p peer_device=P2 peer_interface=to-PE1"
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        description "type=p peer_device=P1 peer_interface=to-PE1"
        ethernet {
            mode network
            mtu 9014
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.11
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::11 {
                    prefix-length 128
                }
            }
        }
        interface "to-P1" {
            admin-state enable
            description "type=p peer_device=P1 peer_interface=to-PE1"
            ip-mtu 9000
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 100.65.0.1
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::1 {
                    prefix-length 126
                }
            }
        }
        interface "to-P2" {
            admin-state enable
            description "type=p peer_device=P2 peer_interface=to-PE1"
            ip-mtu 9000
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 100.65.0.5
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::5 {
                    prefix-length 126
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
            reserved-label-block "SRLB-SRTE" {
                start-label 200000
                end-label 200099
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.11
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                bgp true
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution any
                        }
                        family label-ipv6 {
                            resolution any
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    vpn-ipv4 true
                    ipv6 true
                    vpn-ipv6 true
                    l2-vpn true
                    flow-ipv4 true
                    flow-ipv6 true
                    evpn true
                    label-ipv4 true
                    label-ipv6 true
                    bgp-ls true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                }
            }
            neighbor "100.65.255.3" {
                description "iBGP_to_P3"
                group "IBGP-RR"
            }
            neighbor "100.65.255.4" {
                description "iBGP_to_P4"
                group "IBGP-RR"
            }
        }
        ldp {
            admin-state enable
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P1" {
                admin-group ["black" "blue" "cyan" "purple"]
            }
            interface "to-P2" {
                admin-group ["black" "blue" "cyan" "purple"]
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.11
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 11
                    }
                }
                interface "to-P1" {
                    interface-type point-to-point
                }
                interface "to-P2" {
                    interface-type point-to-point
                }
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P1" {
            }
            interface "to-P2" {
            }
        }
        segment-routing {
            sr-policies {
                admin-state enable
                reserved-label-block "SRLB-SRTE"
                static-policy "PE1-to-PE3-SRTE" {
                    admin-state enable
                    color 100
                    endpoint 100.65.255.13
                    head-end local
                    binding-sid 200011
                    distinguisher 100011013
                    segment-list 1 {
                        admin-state enable
                        segment 1 {
                            mpls-label 100002
                        }
                        segment 2 {
                            mpls-label 100008
                        }
                        segment 3 {
                            mpls-label 100013
                        }
                    }
                }
            }
        }
    }
    routing-options {
        if-attribute {
            admin-group "black" {
                value 8
            }
            admin-group "blue" {
                value 1
            }
            admin-group "cyan" {
                value 5
            }
            admin-group "green" {
                value 2
            }
            admin-group "grey" {
                value 11
            }
            admin-group "orange" {
                value 7
            }
            admin-group "pink" {
                value 10
            }
            admin-group "purple" {
                value 6
            }
            admin-group "red" {
                value 4
            }
            admin-group "white" {
                value 9
            }
            admin-group "yellow" {
                value 3
            }
        }
    }
    service {
        customer "CUST-A" {
            description "Customer A multi-service VLAN handoff"
            customer-id 100
        }
        pw-template "50" {
            provisioned-sdp use
            path-mtu 1518
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-A-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-A"
            endpoint "PE3 VPWS" {
                revert-time 30
            }
            spoke-sdp 11131:21 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
                endpoint {
                    name "PE3 VPWS"
                    precedence primary
                }
            }
            spoke-sdp 11132:22 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
                endpoint {
                    name "PE3 VPWS"
                    precedence 1
                }
            }
            sap 1/1/c1/1:20 {
                admin-state enable
            }
        }
        ies "CUST-A-INET" {
            admin-state enable
            description "VLAN70 - Internet Access"
            service-id 70
            customer "CUST-A"
            interface "to-CUST-A-vlan70" {
                admin-state enable
                sap 1/1/c1/1:70 {
                }
                ipv4 {
                    primary {
                        address 65.65.0.1
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:a::1 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 11121 {
            admin-state enable
            description "SR-Tunnel-to-PE2-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.12
            }
        }
        sdp 11131 {
            admin-state enable
            description "SR-Tunnel-to-PE3"
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.13
            }
        }
        sdp 11132 {
            admin-state enable
            description "BGP-Tunnel-to-PE3"
            delivery-type mpls
            path-mtu 1514
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.13
            }
        }
        sdp 11133 {
            admin-state enable
            description "SR-Tunnel-to-PE3-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.13
            }
        }
        sdp 11134 {
            admin-state enable
            description "BGP-Tunnel-to-PE3-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.13
            }
        }
        sdp 11141 {
            admin-state enable
            description "SR-Tunnel-to-PE4-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.14
            }
        }
        sdp 11142 {
            admin-state enable
            description "BGP-Tunnel-to-PE4-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.14
            }
        }
        vpls "CUST-A-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-A"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution any
                    }
                }
            }
            sap 1/1/c1/1:40 {
            }
        }
        vpls "CUST-A-EVPN" {
            admin-state enable
            description "VLAN60 - EVPN MPLS/SR"
            service-id 60
            customer "CUST-A"
            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }
            bgp-evpn {
                evi 60
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c1/1:60 {
            }
        }
        vpls "CUST-A-VPLS-BGPAD" {
            admin-state enable
            description "VLAN50 - VPLS BGP-AD"
            service-id 50
            customer "CUST-A"
            ignore-l2vpn-mtu-mismatch true
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "PE1"
                    id 1
                }
            }
            sap 1/1/c1/1:50 {
            }
        }
        vpls "CUST-A-VPLS-LDP" {
            admin-state enable
            description "VLAN30 - VPLS LDP"
            service-id 30
            customer "CUST-A"
            endpoint "PE2 VPLS LDP" {
                revert-time 30
            }
            split-horizon-group "core-mesh-protection" {
            }
            spoke-sdp 11131:31 {
                admin-state enable
                vlan-vc-tag 20
                split-horizon-group "core-mesh-protection"
                vc-type vlan
                endpoint {
                    name "PE2 VPLS LDP"
                    precedence primary
                }
                stp {
                    admin-state disable
                }
            }
            spoke-sdp 11132:32 {
                admin-state enable
                vlan-vc-tag 20
                split-horizon-group "core-mesh-protection"
                vc-type vlan
                endpoint {
                    name "PE2 VPLS LDP"
                    precedence 1
                }
                stp {
                    admin-state disable
                }
            }
            sap 1/1/c1/1:30 {
            }
        }
        vprn "CUST-A-L3VPN" {
            admin-state enable
            description "VLAN10 - L3VPN"
            service-id 10
            customer "CUST-A"
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1011"
                    vrf-target {
                        community "target:64515:101"
                    }
                    vrf-import {
                        policy ["VRF-IMPORT-PE1"]
                    }
                    vrf-export {
                        policy ["VRF-EXPORT-OSPF"]
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            interface "to-CUST-A1-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.16.0.2
                        prefix-length 30
                    }
                }
                sap 1/1/c1/1:10 {
                }
            }
            ospf 0 {
                admin-state enable
                export-policy ["OSPF-EXPORT-BGP-VPRN10"]
                super-backbone true
                area 0.0.0.0 {
                    interface "to-CUST-A1-vlan10" {
                        interface-type point-to-point
                    }
                }
            }
        }
    }
