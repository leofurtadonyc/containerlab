configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    policy-options {
        prefix-list "AS64515-LOOPBACKS-FROM-CE" {
            prefix 100.65.255.0/24 type through {
                through-length 32
            }
        }
        policy-statement "BGP-EXPORT-VPRN10-TO-CE-C2" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "BGP-IMPORT-VPRN10-FROM-CE-C2" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "BGP-IMPORT-VPRN110-FROM-AS64515" {
            entry 10 {
                from {
                    prefix-list ["AS64515-LOOPBACKS-FROM-CE"]
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
        policy-statement "BGP-EXPORT-VPRN110-TO-AS64515" {
            entry 10 {
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c6 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c6/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    router "Base" {
        autonomous-system 64516
        interface "system" {
            ipv4 {
                primary {
                    address 100.66.255.12
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:66:255::12 {
                    prefix-length 128
                }
            }
        }
        interface "to-CSC2-P3" {
            admin-state enable
            description "To_CSC2-P3_1/1/c2/1"
            ip-mtu 9000
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 100.66.0.17
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66::12 {
                    prefix-length 126
                }
            }
        }
        interface "to-CSC2-P4" {
            admin-state enable
            description "To_CSC2-P4_1/1/c3/1"
            ip-mtu 9000
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 100.66.0.22
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:66::16 {
                    prefix-length 126
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        bgp {
            admin-state enable
            router-id 100.66.255.12
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "EBGP-CPE" {
                type external
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                }
            }
            group "IBGP-CSC2" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    vpn-ipv4 true
                    ipv6 true
                    vpn-ipv6 true
                    l2-vpn true
                    flow-ipv4 true
                    flow-ipv6 true
                    evpn true
                    label-ipv4 true
                    label-ipv6 true
                    bgp-ls true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                }
            }
            neighbor "100.66.255.11" {
                description "iBGP_to_CSC2-PE1"
                group "IBGP-CSC2"
            }
        }
        ldp {
            admin-state enable
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-CSC2-P3" {
            }
            interface "to-CSC2-P4" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.66.255.12
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 312
                    }
                }
                interface "to-CSC2-P3" {
                    interface-type point-to-point
                }
                interface "to-CSC2-P4" {
                    interface-type point-to-point
                }
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-CSC2-P3" {
            }
            interface "to-CSC2-P4" {
            }
        }
    }
    service {
        customer "CUST-AS64515" {
            description "Carrier Supporting Carrier handoff to AS64515"
            customer-id 315
        }
        customer "CUST-C" {
            description "Pair C - CPE-C2 side"
            customer-id 300
        }
        pw-template "50" {
            provisioned-sdp use
            path-mtu 1518
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-C-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-C"
            spoke-sdp 611:20 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
            }
            sap 1/1/c1/1:20 {
                admin-state enable
            }
        }
        ies "CUST-C-INET" {
            admin-state enable
            service-id 70
            customer "CUST-C"
            interface "to-CPE-C2-vlan70" {
                admin-state enable
                sap 1/1/c1/1:70 {
                }
                ipv4 {
                    primary {
                        address 66.66.0.5
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:c::5 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 611 {
            admin-state enable
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.66.255.11
            }
        }
        sdp 1211 {
            admin-state enable
            description "SR-Tunnel-to-PE1"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.66.255.11
            }
        }
        vpls "CUST-C-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-C"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
            }
            sap 1/1/c1/1:40 {
            }
        }
        vpls "CUST-C-EVPN" {
            admin-state enable
            service-id 60
            customer "CUST-C"
            bgp 1 {
                route-distinguisher "64516:60"
                route-target {
                    export "target:64516:60"
                    import "target:64516:60"
                }
            }
            bgp-evpn {
                evi 260
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c1/1:60 {
            }
        }
        vpls "CUST-C-VPLS-BGPAD" {
            admin-state enable
            service-id 50
            customer "CUST-C"
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64516:50"
                route-target {
                    export "target:64516:50"
                    import "target:64516:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "CSC2-PE2"
                    id 2
                }
            }
            sap 1/1/c1/1:50 {
            }
        }
        vpls "CUST-C-VPLS-LDP" {
            admin-state enable
            service-id 30
            customer "CUST-C"
            mesh-sdp 611:230 {
            }
            sap 1/1/c1/1:30 {
            }
        }
        vprn "CUST-C-L3VPN" {
            admin-state enable
            service-id 10
            customer "CUST-C"
            autonomous-system 64516
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64516:210"
                    vrf-target {
                        community "target:64516:210"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            bgp {
                admin-state enable
                router-id 100.66.255.12
                group "CE-C2" {
                    as-override true
                    type external
                    peer-as 65003
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["BGP-IMPORT-VPRN10-FROM-CE-C2"]
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN10-TO-CE-C2"]
                    }
                }
                neighbor "172.18.0.6" {
                    group "CE-C2"
                }
            }
            interface "to-CPE-C2-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.18.0.5
                        prefix-length 30
                    }
                }
                sap 1/1/c1/1:10 {
                }
            }
        }
        vprn "CSC-AS64515" {
            admin-state enable
            service-id 110
            customer "CUST-AS64515"
            autonomous-system 64516
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64516:110"
                    vrf-target {
                        community "target:64516:110"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            bgp {
                admin-state enable
                router-id 100.66.255.12
                group "CE-AS64515" {
                    admin-state enable
                    as-override true
                    type external
                    peer-as 64515
                    local-address 100.66.1.5
                    family {
                        ipv4 true
                        ipv6 true
                        label-ipv4 true
                    }
                    import {
                        policy ["BGP-IMPORT-VPRN110-FROM-AS64515"]
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN110-TO-AS64515"]
                    }
                }
                neighbor "100.66.1.6" {
                    admin-state enable
                    group "CE-AS64515"
                    peer-as 64515
                }
            }
            interface "to-P8" {
                admin-state enable
                description "To_P8_1/1/c6/1"
                ip-mtu 9000
                ipv4 {
                    primary {
                        address 100.66.1.5
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:66:1::5 {
                        prefix-length 126
                    }
                }
                sap 1/1/c6/1:110 {
                }
            }
        }
    }
    system {
        name "CSC2-PE2"
        grpc {
            admin-state enable
            allow-unsecure-connection
            gnmi {
                admin-state enable
                auto-config-save true
            }
            gnoi {
                cert-mgmt {
                    admin-state enable
                }
                file {
                    admin-state enable
                }
                system {
                    admin-state enable
                }
            }
            md-cli {
                admin-state enable
            }
            rib-api {
                admin-state enable
            }
        }
        management-interface {
            netconf {
                auto-config-save true
                listen {
                    admin-state enable
                }
            }
            snmp {
                packet-size 9216
                streaming {
                    admin-state enable
                }
            }
        }
        login-control {
            login-banner true
            pre-login-message {
                message "................................................................\n:                  Welcome to Nokia SR OS!                     :\n:                                                              :\n:                                                              :\n: YANG:          https://yang.labctl.net/                      :\n: Community:     https://containerlab.dev/community/           :\n: Discord:       https://containerlab.dev/discord/             :\n................................................................\n"
            }
        }
        security {
            aaa {
                local-profiles {
                    profile "administrative" {
                        default-action permit-all
                        entry 10 {
                            match "configure system security"
                            action permit
                        }
                        entry 20 {
                            match "show system security"
                            action permit
                        }
                        entry 30 {
                            match "tools perform security"
                            action permit
                        }
                        entry 40 {
                            match "tools dump security"
                            action permit
                        }
                        entry 42 {
                            match "tools dump system security"
                            action permit
                        }
                        entry 50 {
                            match "admin system security"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                        entry 110 {
                            match "show li"
                            action deny
                        }
                        entry 111 {
                            match "clear li"
                            action deny
                        }
                        entry 112 {
                            match "tools dump li"
                            action deny
                        }
                        entry 113 {
                            match "tools perform system security"
                            action permit
                        }
                        grpc {
                            rpc-authorization {
                                gnmi-capabilities permit
                                gnmi-get permit
                                gnmi-set permit
                                gnmi-subscribe permit
                                gnoi-cert-mgmt-rotate permit
                                gnoi-cert-mgmt-install permit
                                gnoi-cert-mgmt-getcert permit
                                gnoi-cert-mgmt-revoke permit
                                gnoi-cert-mgmt-cangenerate permit
                                gnoi-file-get permit
                                gnoi-file-transfertoremote permit
                                gnoi-file-put permit
                                gnoi-file-stat permit
                                gnoi-file-remove permit
                                gnoi-system-ping permit
                                gnoi-system-traceroute permit
                                gnoi-system-time permit
                                gnoi-system-setpackage permit
                                gnoi-system-switchcontrolprocessor permit
                                gnoi-system-reboot permit
                                gnoi-system-rebootstatus permit
                                gnoi-system-cancelreboot permit
                                md-cli-session permit
                                rib-api-getversion permit
                                rib-api-modify permit
                            }
                        }
                        netconf {
                            base-op-authorization {
                                action true
                                cancel-commit true
                                close-session true
                                commit true
                                copy-config true
                                create-subscription true
                                delete-config true
                                discard-changes true
                                edit-config true
                                get true
                                get-config true
                                get-data true
                                get-schema true
                                kill-session true
                                lock true
                                validate true
                            }
                        }
                    }
                    profile "default" {
                        entry 10 {
                            match "exec"
                            action permit
                        }
                        entry 20 {
                            match "exit"
                            action permit
                        }
                        entry 30 {
                            match "help"
                            action permit
                        }
                        entry 40 {
                            match "logout"
                            action permit
                        }
                        entry 50 {
                            match "password"
                            action permit
                        }
                        entry 60 {
                            match "show config"
                            action deny
                        }
                        entry 65 {
                            match "show li"
                            action deny
                        }
                        entry 66 {
                            match "clear li"
                            action deny
                        }
                        entry 67 {
                            match "tools dump li"
                            action deny
                        }
                        entry 68 {
                            match "state li"
                            action deny
                        }
                        entry 70 {
                            match "show"
                            action permit
                        }
                        entry 75 {
                            match "state"
                            action permit
                        }
                        entry 80 {
                            match "enable-admin"
                            action permit
                        }
                        entry 90 {
                            match "enable"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                    }
                }
            }
            snmp {
                community "76HzdddhlPpRo1Vql+ZB5spLqccgYQ== hash2" {
                    access-permissions r
                    version v2c
                }
            }
            ssh {
                server-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                client-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                server-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
                client-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
            }
            user-params {
                attempts {
                    count 64
                }
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        restricted-to-home false
                        access {
                            console true
                            netconf true
                            grpc true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "Containerlab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
