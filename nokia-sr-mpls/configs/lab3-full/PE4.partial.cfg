configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    policy-options {
        community "RT-101" {
            member "target:64515:101" { }
        }
        community "RT-102" {
            member "target:64515:102" { }
        }
        community "RT-103" {
            member "target:64515:103" { }
        }
        community "RT-104" {
            member "target:64515:104" { }
        }
        policy-statement "BGP-EXPORT-VPRN10-TO-CE" {
            entry 10 {
                from {
                    protocol {
                        name [bgp-vpn]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "BGP-IMPORT-VPRN10-FROM-CE" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "VRF-EXPORT-CE-BGP" {
            entry 10 {
                from {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                    community {
                        add ["RT-104"]
                    }
                }
            }
            default-action {
                action-type reject
            }
        }
        policy-statement "VRF-IMPORT-PE4" {
            entry 10 {
                from {
                    community {
                        expression "[RT-102]"
                    }
                }
                action {
                    action-type accept
                }
            }
            default-action {
                action-type reject
            }
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    port 1/1/c4 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c4/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c5 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c5/1 {
        admin-state enable
        ethernet {
            mode access
            encap-type dot1q
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.14
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::14 {
                    prefix-length 128
                }
            }
        }
        interface "to-P7" {
            admin-state enable
            description "To_P7_1/1/c2/1"
            ip-mtu 9000
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 100.65.0.66
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::42 {
                    prefix-length 126
                }
            }
        }
        interface "to-P8" {
            admin-state enable
            description "To_P8_1/1/c4/1"
            ip-mtu 9000
            port 1/1/c4/1
            ipv4 {
                primary {
                    address 100.65.0.70
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::47 {
                    prefix-length 126
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.14
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family vpn {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                                bgp true
                            }
                        }
                        family label-ipv4 {
                            resolution any
                        }
                        family label-ipv6 {
                            resolution any
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-RR" {
                vpn-apply-export true
                vpn-apply-import true
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    vpn-ipv4 true
                    ipv6 true
                    vpn-ipv6 true
                    l2-vpn true
                    flow-ipv4 true
                    flow-ipv6 true
                    evpn true
                    label-ipv4 true
                    label-ipv6 true
                    bgp-ls true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                }
            }
            neighbor "100.65.255.5" {
                description "iBGP_to_P5"
                group "IBGP-RR"
            }
            neighbor "100.65.255.6" {
                description "iBGP_to_P6"
                group "IBGP-RR"
            }
        }
        ldp {
            admin-state enable
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.14
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 14
                    }
                }
                interface "to-P7" {
                    interface-type point-to-point
                }
                interface "to-P8" {
                    interface-type point-to-point
                }
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P7" {
            }
            interface "to-P8" {
            }
        }
    }
    service {
        customer "CUST-NOC" {
            description "NOC routers"
            customer-id 300
        }
        customer "CUST-B" {
            description "Pair B - CPE-B2 side"
            customer-id 200
        }
        pw-template "50" {
            provisioned-sdp use
            path-mtu 1514
            split-horizon-group {
                name "vpls-shg"
            }
        }
        epipe "CUST-B-VPWS-LDP" {
            admin-state enable
            description "VLAN20 - VPWS LDP"
            service-id 20
            customer "CUST-B"
            endpoint "PE2 VPWS" {
                revert-time 30
            }
            spoke-sdp 14121:121 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
                endpoint {
                    name "PE2 VPWS"
                    precedence primary
                }
            }
            spoke-sdp 14122:122 {
                admin-state enable
                vlan-vc-tag 20
                vc-type vlan
                endpoint {
                    name "PE2 VPWS"
                    precedence 1
                }
            }
            sap 1/1/c3/1:20 {
                admin-state enable
            }
        }
        ies "CUST-B-INET" {
            admin-state enable
            service-id 70
            customer "CUST-B"
            interface "to-CPE-B2-vlan70" {
                admin-state enable
                sap 1/1/c3/1:70 {
                }
                ipv4 {
                    primary {
                        address 65.65.0.13
                        prefix-length 30
                    }
                }
                ipv6 {
                    address 2001:db8:b::5 {
                        prefix-length 126
                    }
                }
            }
        }
        sdp 14111 {
            admin-state enable
            description "SR-Tunnel-to-PE1-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.11
            }
        }
        sdp 14112 {
            admin-state enable
            description "BGP-Tunnel-to-PE1-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.11
            }
        }
        sdp 14121 {
            admin-state enable
            description "SR-Tunnel-to-PE2"
            delivery-type mpls
            path-mtu 1514
            sr-ospf true
            far-end {
                ip-address 100.65.255.12
            }
        }
        sdp 14122 {
            admin-state enable
            description "BGP-Tunnel-to-PE2"
            delivery-type mpls
            path-mtu 1514
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.12
            }
        }
        sdp 14123 {
            admin-state enable
            description "SR-Tunnel-to-PE2-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.12
            }
        }
        sdp 14124 {
            admin-state enable
            description "BGP-Tunnel-to-PE2-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            bgp-tunnel true
            far-end {
                ip-address 100.65.255.12
            }
        }
