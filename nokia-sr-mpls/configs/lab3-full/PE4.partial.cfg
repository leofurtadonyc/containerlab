            admin-state enable
            description "SR-Tunnel-to-PE3-BGP-Signaling"
            delivery-type mpls
            path-mtu 9000
            signaling bgp
            sr-ospf true
            far-end {
                ip-address 100.65.255.13
            }
        }
        vpls "CUST-B-BGP-EVPN" {
            admin-state enable
            service-id 40
            customer "CUST-B"
            proxy-arp {
                admin-state enable
                dynamic-populate true
            }
            proxy-nd {
                admin-state enable
                dynamic-populate true
            }
            bgp-evpn {
                evi 40
                mpls 1 {
                    admin-state enable
                    ingress-replication-bum-label true
                    auto-bind-tunnel {
                        resolution any
                    }
                }
            }
            sap 1/1/c3/1:40 {
            }
        }
        vpls "CUST-B-EVPN" {
            admin-state enable
            service-id 60
            customer "CUST-B"
            bgp 1 {
                route-distinguisher "64515:60"
                route-target {
                    export "target:64515:60"
                    import "target:64515:60"
                }
            }
            bgp-evpn {
                evi 160
                mpls 1 {
                    admin-state enable
                }
            }
            sap 1/1/c3/1:60 {
            }
        }
        vpls "CUST-B-VPLS-BGPAD" {
            admin-state enable
            description "VLAN50 - VPLS BGP-AD"
            service-id 50
            customer "CUST-B"
            ignore-l2vpn-mtu-mismatch true
            stp {
                admin-state disable
            }
            bgp 1 {
                route-distinguisher "64515:50"
                route-target {
                    export "target:64515:50"
                    import "target:64515:50"
                }
                pw-template-binding "50" {
                }
            }
            bgp-vpls {
                admin-state enable
                maximum-ve-id 10
                ve {
                    name "PE4"
                    id 4
                }
            }
            sap 1/1/c3/1:50 {
            }
        }
        vpls "CUST-B-VPLS-LDP" {
            admin-state enable
            service-id 30
            customer "CUST-B"
            mesh-sdp 14121:130 {
            }
            sap 1/1/c3/1:30 {
            }
        }
        vprn "CUST-B-L3VPN" {
            admin-state enable
            service-id 10
            customer "CUST-B"
            autonomous-system 64515
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1014"
                    vrf-target {
                        community "target:64515:104"
                    }
                    vrf-import {
                        policy ["VRF-IMPORT-PE4"]
                    }
                    vrf-export {
                        policy ["VRF-EXPORT-CE-BGP"]
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                            bgp true
                        }
                    }
                }
            }
            bgp {
                admin-state enable
                router-id 100.65.255.14
                group "CE-B2" {
                    admin-state enable
                    as-override true
                    type external
                    peer-as 65002
                    local-address 172.17.0.5
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["BGP-IMPORT-VPRN10-FROM-CE"]
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN10-TO-CE"]
                    }
                }
                neighbor "172.17.0.6" {
                    admin-state enable
                    group "CE-B2"
                    peer-as 65002
                }
            }
            interface "to-CPE-B2-vlan10" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.17.0.5
                        prefix-length 30
                    }
                }
                sap 1/1/c3/1:10 {
                }
            }
        }
        vprn "CUST-NOC-L3VPN" {
            admin-state enable
            description "VLAN50 - NOC VPRN BGP"
            service-id 150
            customer "CUST-NOC"
            autonomous-system 64515
            bgp-ipvpn {
                mpls {
                    admin-state enable
                    route-distinguisher "64515:1514"
                    vrf-target {
                        community "target:64515:150"
                    }
                    auto-bind-tunnel {
                        resolution filter
                        resolution-filter {
                            ldp true
                            sr-ospf true
                        }
                    }
                }
            }
            bgp {
                admin-state enable
                router-id 100.65.255.14
                group "CE-NOC-R2" {
                    admin-state enable
                    as-override true
                    type external
                    peer-as 65010
                    local-address 172.31.50.5
                    family {
                        ipv4 true
                    }
                    import {
                        policy ["BGP-IMPORT-VPRN10-FROM-CE"]
                    }
                    export {
                        policy ["BGP-EXPORT-VPRN10-TO-CE"]
                    }
                }
                neighbor "172.31.50.6" {
                    admin-state enable
                    group "CE-NOC-R2"
                    peer-as 65010
                }
            }
            interface "to-NOC-R2-vlan50" {
                admin-state enable
                ipv4 {
                    primary {
                        address 172.31.50.5
                        prefix-length 30
                    }
                }
                sap 1/1/c5/1:50 {
                }
            }
        }
