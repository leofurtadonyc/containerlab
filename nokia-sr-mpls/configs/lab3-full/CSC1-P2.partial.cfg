configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mtu 9014
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mtu 9014
        }
    }
    router "Base" {
        interface "system" {
            ipv4 {
                primary {
                    address 100.64.255.2
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:64:255::2 {
                    prefix-length 128
                }
            }
        }
        interface "to-CSC1-P4" {
            admin-state enable
            description "To_CSC1-P4_1/1/c1/1"
            ip-mtu 9000
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 100.64.0.13
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64::13 {
                    prefix-length 126
                }
            }
        }
        interface "to-CSC1-PE1" {
            admin-state enable
            description "To_CSC1-PE1_1/1/c3/1"
            ip-mtu 9000
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 100.64.0.6
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64::6 {
                    prefix-length 126
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        ldp {
            admin-state enable
            interface-parameters {
                interface "to-CSC1-P4" {
                    ipv4 {
                        admin-state enable
                    }
                    ipv6 {
                        admin-state enable
                    }
                }
                interface "to-CSC1-PE1" {
                    ipv4 {
                        admin-state enable
                    }
                    ipv6 {
                        admin-state enable
                    }
                }
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-CSC1-P4" {
            }
            interface "to-CSC1-PE1" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.64.255.2
            advertise-router-capability area
            traffic-engineering true
            area 0.0.0.0 {
                interface "system" {
                    passive true
                }
                interface "to-CSC1-P4" {
                    interface-type point-to-point
                }
                interface "to-CSC1-PE1" {
                    interface-type point-to-point
                }
            }
        }
        rsvp {
            admin-state enable
            interface "system" {
            }
            interface "to-CSC1-P4" {
            }
            interface "to-CSC1-PE1" {
            }
        }
    }
    system {
        name "CSC1-P2"
        grpc {
            admin-state enable
            allow-unsecure-connection
            gnmi {
                admin-state enable
                auto-config-save true
            }
            gnoi {
                cert-mgmt {
                    admin-state enable
                }
                file {
                    admin-state enable
                }
                system {
                    admin-state enable
                }
            }
            md-cli {
                admin-state enable
            }
            rib-api {
                admin-state enable
            }
        }
        management-interface {
            netconf {
                auto-config-save true
                listen {
                    admin-state enable
                }
            }
            snmp {
                packet-size 9216
                streaming {
                    admin-state enable
                }
            }
        }
        login-control {
            login-banner true
            pre-login-message {
                message "................................................................\n:                  Welcome to Nokia SR OS!                     :\n:                                                              :\n:                                                              :\n: YANG:          https://yang.labctl.net/                      :\n: Community:     https://containerlab.dev/community/           :\n: Discord:       https://containerlab.dev/discord/             :\n................................................................\n"
            }
        }
        security {
            aaa {
                local-profiles {
                    profile "administrative" {
                        default-action permit-all
                        entry 10 {
                            match "configure system security"
                            action permit
                        }
                        entry 20 {
                            match "show system security"
                            action permit
                        }
                        entry 30 {
                            match "tools perform security"
                            action permit
                        }
                        entry 40 {
                            match "tools dump security"
                            action permit
                        }
                        entry 42 {
                            match "tools dump system security"
                            action permit
                        }
                        entry 50 {
                            match "admin system security"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                        entry 110 {
                            match "show li"
                            action deny
                        }
                        entry 111 {
                            match "clear li"
                            action deny
                        }
                        entry 112 {
                            match "tools dump li"
                            action deny
                        }
                        entry 113 {
                            match "tools perform system security"
                            action permit
                        }
                        grpc {
                            rpc-authorization {
                                gnmi-capabilities permit
                                gnmi-get permit
                                gnmi-set permit
                                gnmi-subscribe permit
                                gnoi-cert-mgmt-rotate permit
                                gnoi-cert-mgmt-install permit
                                gnoi-cert-mgmt-getcert permit
                                gnoi-cert-mgmt-revoke permit
                                gnoi-cert-mgmt-cangenerate permit
                                gnoi-file-get permit
                                gnoi-file-transfertoremote permit
                                gnoi-file-put permit
                                gnoi-file-stat permit
                                gnoi-file-remove permit
                                gnoi-system-ping permit
                                gnoi-system-traceroute permit
                                gnoi-system-time permit
                                gnoi-system-setpackage permit
                                gnoi-system-switchcontrolprocessor permit
                                gnoi-system-reboot permit
                                gnoi-system-rebootstatus permit
                                gnoi-system-cancelreboot permit
                                md-cli-session permit
                                rib-api-getversion permit
                                rib-api-modify permit
                            }
                        }
                        netconf {
                            base-op-authorization {
                                action true
                                cancel-commit true
                                close-session true
                                commit true
                                copy-config true
                                create-subscription true
                                delete-config true
                                discard-changes true
                                edit-config true
                                get true
                                get-config true
                                get-data true
                                get-schema true
                                kill-session true
                                lock true
                                validate true
                            }
                        }
                    }
                    profile "default" {
                        entry 10 {
                            match "exec"
                            action permit
                        }
                        entry 20 {
                            match "exit"
                            action permit
                        }
                        entry 30 {
                            match "help"
                            action permit
                        }
                        entry 40 {
                            match "logout"
                            action permit
                        }
                        entry 50 {
                            match "password"
                            action permit
                        }
                        entry 60 {
                            match "show config"
                            action deny
                        }
                        entry 65 {
                            match "show li"
                            action deny
                        }
                        entry 66 {
                            match "clear li"
                            action deny
                        }
                        entry 67 {
                            match "tools dump li"
                            action deny
                        }
                        entry 68 {
                            match "state li"
                            action deny
                        }
                        entry 70 {
                            match "show"
                            action permit
                        }
                        entry 75 {
                            match "state"
                            action permit
                        }
                        entry 80 {
                            match "enable-admin"
                            action permit
                        }
                        entry 90 {
                            match "enable"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                    }
                }
            }
            snmp {
                community "76HzdddhlPpRo1Vql+ZB5spLqccgYQ== hash2" {
                    access-permissions r
                    version v2c
                }
            }
            ssh {
                server-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                client-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                server-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
                client-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
            }
            user-params {
                attempts {
                    count 64
                }
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        restricted-to-home false
                        access {
                            console true
                            netconf true
                            grpc true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "Containerlab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
