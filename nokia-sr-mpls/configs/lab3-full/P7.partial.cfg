configure
    card 1 {
        admin-state enable
        card-type iom-1
        mda 1 {
            admin-state enable
            mda-type me12-100gb-qsfp28
        }
    }
    log {
        filter "1001" {
            named-entry "10" {
                description "Collect only events of major severity or higher"
                action forward
                match {
                    severity {
                        gte major
                    }
                }
            }
        }
        log-id "99" {
            description "Default System Log"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
        log-id "100" {
            description "Default Serious Errors Log"
            filter "1001"
            source {
                main true
            }
            destination {
                memory {
                    max-entries 500
                }
            }
        }
    }
    policy-options {
        policy-statement "FROM-IPV6-TO-LABEL-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp]
                    }
                }
                to {
                    protocol {
                        name [bgp-label]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
        policy-statement "FROM-LABEL-IPV6-TO-IPV6" {
            entry 10 {
                from {
                    family [ipv6]
                    protocol {
                        name [bgp-label]
                    }
                }
                to {
                    protocol {
                        name [bgp]
                    }
                }
                action {
                    action-type accept
                }
            }
        }
    }
    port 1/1/c1 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c1/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c2 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c2/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c3 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c3/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c4 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c4/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    port 1/1/c6 {
        admin-state enable
        connector {
            breakout c1-100g
        }
    }
    port 1/1/c6/1 {
        admin-state enable
        ethernet {
            mode network
            mtu 9014
        }
    }
    router "Base" {
        autonomous-system 64515
        interface "system" {
            ipv4 {
                primary {
                    address 100.65.255.7
                    prefix-length 32
                }
            }
            ipv6 {
                address 2001:db8:65:255::7 {
                    prefix-length 128
                }
            }
        }
        interface "to-CSC1-PE2" {
            admin-state enable
            description "To_CSC1-PE2_1/1/c6/1"
            ip-mtu 9000
            port 1/1/c6/1
            ipv4 {
                primary {
                    address 100.64.1.6
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:64:1::6 {
                    prefix-length 126
                }
            }
        }
        interface "to-P5" {
            admin-state enable
            description "To_P5_1/1/c1/1"
            ip-mtu 9000
            port 1/1/c1/1
            ipv4 {
                primary {
                    address 100.65.0.46
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::2e {
                    prefix-length 126
                }
            }
        }
        interface "to-P8" {
            admin-state enable
            description "To_P8_1/1/c3/1"
            ip-mtu 9000
            port 1/1/c3/1
            ipv4 {
                primary {
                    address 100.65.0.53
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::35 {
                    prefix-length 126
                }
            }
        }
        interface "to-PE3" {
            admin-state enable
            description "To_PE3_1/1/c4/1"
            ip-mtu 9000
            port 1/1/c4/1
            ipv4 {
                primary {
                    address 100.65.0.57
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::39 {
                    prefix-length 126
                }
            }
        }
        interface "to-PE4" {
            admin-state enable
            description "To_PE4_1/1/c2/1"
            ip-mtu 9000
            port 1/1/c2/1
            ipv4 {
                primary {
                    address 100.65.0.65
                    prefix-length 30
                }
            }
            ipv6 {
                address 2001:db8:65::41 {
                    prefix-length 126
                }
            }
        }
        mpls-labels {
            sr-labels {
                start 100000
                end 100999
            }
        }
        bgp {
            admin-state enable
            router-id 100.65.255.7
            rapid-withdrawal true
            graceful-restart {
            }
            next-hop-resolution {
                shortcut-tunnel {
                    family ipv4 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                    family ipv6 {
                        resolution filter
                        resolution-filter {
                            sr-ospf true
                        }
                    }
                }
                labeled-routes {
                    transport-tunnel {
                        family label-ipv4 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                        family label-ipv6 {
                            resolution filter
                            resolution-filter {
                                sr-ospf true
                            }
                        }
                    }
                }
            }
            rib-management {
                ipv6 {
                    route-table-import {
                        policy-name "FROM-LABEL-IPV6-TO-IPV6"
                    }
                }
                label-ipv6 {
                    route-table-import {
                        policy-name "FROM-IPV6-TO-LABEL-IPV6"
                    }
                }
            }
            group "IBGP-CORE" {
                next-hop-self true
                type internal
                local-address "system"
                family {
                    ipv4 true
                    ipv6 true
                    flow-ipv4 true
                    flow-ipv6 true
                    label-ipv4 true
                    label-ipv6 true
                    bgp-ls true
                    sr-policy-ipv4 true
                    sr-policy-ipv6 true
                }
            }
            neighbor "100.64.255.11" {
                description "eBGP_to_CSC1-PE1"
                group "IBGP-CORE"
            }
            neighbor "100.65.255.5" {
                description "iBGP_to_P5"
                group "IBGP-CORE"
            }
            neighbor "100.65.255.6" {
                description "iBGP_to_P6"
                group "IBGP-CORE"
            }
        }
        mpls {
            admin-state enable
            interface "system" {
            }
            interface "to-P5" {
            }
            interface "to-PE3" {
            }
            interface "to-PE4" {
            }
        }
        ospf 0 {
            admin-state enable
            router-id 100.65.255.7
            advertise-router-capability area
            traffic-engineering true
            segment-routing {
                admin-state enable
                prefix-sid-range {
                    global
                }
            }
            area 0.0.0.0 {
                interface "system" {
                    passive true
                    node-sid {
                        index 7
                    }
                }
                interface "to-P5" {
                    interface-type point-to-point
                }
                interface "to-PE3" {
                    interface-type point-to-point
                }
                interface "to-PE4" {
                    interface-type point-to-point
                }
            }
        }
        rsvp {
            admin-state disable
            interface "system" {
            }
            interface "to-P5" {
            }
            interface "to-PE3" {
            }
            interface "to-PE4" {
            }
        }
    }
    system {
        name "P7"
        grpc {
            admin-state enable
            allow-unsecure-connection
            gnmi {
                admin-state enable
                auto-config-save true
            }
            gnoi {
                cert-mgmt {
                    admin-state enable
                }
                file {
                    admin-state enable
                }
                system {
                    admin-state enable
                }
            }
            md-cli {
                admin-state enable
            }
            rib-api {
                admin-state enable
            }
        }
        management-interface {
            netconf {
                auto-config-save true
                listen {
                    admin-state enable
                }
            }
            snmp {
                packet-size 9216
                streaming {
                    admin-state enable
                }
            }
        }
        login-control {
            login-banner true
            pre-login-message {
                message "................................................................\n:                  Welcome to Nokia SR OS!                     :\n:                                                              :\n:                                                              :\n: YANG:          https://yang.labctl.net/                      :\n: Community:     https://containerlab.dev/community/           :\n: Discord:       https://containerlab.dev/discord/             :\n................................................................\n"
            }
        }
        security {
            aaa {
                local-profiles {
                    profile "administrative" {
                        default-action permit-all
                        entry 10 {
                            match "configure system security"
                            action permit
                        }
                        entry 20 {
                            match "show system security"
                            action permit
                        }
                        entry 30 {
                            match "tools perform security"
                            action permit
                        }
                        entry 40 {
                            match "tools dump security"
                            action permit
                        }
                        entry 42 {
                            match "tools dump system security"
                            action permit
                        }
                        entry 50 {
                            match "admin system security"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                        entry 110 {
                            match "show li"
                            action deny
                        }
                        entry 111 {
                            match "clear li"
                            action deny
                        }
                        entry 112 {
                            match "tools dump li"
                            action deny
                        }
                        entry 113 {
                            match "tools perform system security"
                            action permit
                        }
                        grpc {
                            rpc-authorization {
                                gnmi-capabilities permit
                                gnmi-get permit
                                gnmi-set permit
                                gnmi-subscribe permit
                                gnoi-cert-mgmt-rotate permit
                                gnoi-cert-mgmt-install permit
                                gnoi-cert-mgmt-getcert permit
                                gnoi-cert-mgmt-revoke permit
                                gnoi-cert-mgmt-cangenerate permit
                                gnoi-file-get permit
                                gnoi-file-transfertoremote permit
                                gnoi-file-put permit
                                gnoi-file-stat permit
                                gnoi-file-remove permit
                                gnoi-system-ping permit
                                gnoi-system-traceroute permit
                                gnoi-system-time permit
                                gnoi-system-setpackage permit
                                gnoi-system-switchcontrolprocessor permit
                                gnoi-system-reboot permit
                                gnoi-system-rebootstatus permit
                                gnoi-system-cancelreboot permit
                                md-cli-session permit
                                rib-api-getversion permit
                                rib-api-modify permit
                            }
                        }
                        netconf {
                            base-op-authorization {
                                action true
                                cancel-commit true
                                close-session true
                                commit true
                                copy-config true
                                create-subscription true
                                delete-config true
                                discard-changes true
                                edit-config true
                                get true
                                get-config true
                                get-data true
                                get-schema true
                                kill-session true
                                lock true
                                validate true
                            }
                        }
                    }
                    profile "default" {
                        entry 10 {
                            match "exec"
                            action permit
                        }
                        entry 20 {
                            match "exit"
                            action permit
                        }
                        entry 30 {
                            match "help"
                            action permit
                        }
                        entry 40 {
                            match "logout"
                            action permit
                        }
                        entry 50 {
                            match "password"
                            action permit
                        }
                        entry 60 {
                            match "show config"
                            action deny
                        }
                        entry 65 {
                            match "show li"
                            action deny
                        }
                        entry 66 {
                            match "clear li"
                            action deny
                        }
                        entry 67 {
                            match "tools dump li"
                            action deny
                        }
                        entry 68 {
                            match "state li"
                            action deny
                        }
                        entry 70 {
                            match "show"
                            action permit
                        }
                        entry 75 {
                            match "state"
                            action permit
                        }
                        entry 80 {
                            match "enable-admin"
                            action permit
                        }
                        entry 90 {
                            match "enable"
                            action permit
                        }
                        entry 100 {
                            match "configure li"
                            action deny
                        }
                    }
                }
            }
            snmp {
                community "76HzdddhlPpRo1Vql+ZB5spLqccgYQ== hash2" {
                    access-permissions r
                    version v2c
                }
            }
            ssh {
                server-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                client-cipher-list-v2 {
                    cipher 190 {
                        name aes256-ctr
                    }
                    cipher 192 {
                        name aes192-ctr
                    }
                    cipher 194 {
                        name aes128-ctr
                    }
                    cipher 200 {
                        name aes128-cbc
                    }
                    cipher 205 {
                        name 3des-cbc
                    }
                    cipher 225 {
                        name aes192-cbc
                    }
                    cipher 230 {
                        name aes256-cbc
                    }
                }
                server-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
                client-mac-list-v2 {
                    mac 200 {
                        name hmac-sha2-512
                    }
                    mac 210 {
                        name hmac-sha2-256
                    }
                    mac 215 {
                        name hmac-sha1
                    }
                    mac 220 {
                        name hmac-sha1-96
                    }
                    mac 225 {
                        name hmac-md5
                    }
                    mac 240 {
                        name hmac-md5-96
                    }
                }
            }
            user-params {
                attempts {
                    count 64
                }
                local-user {
                    user "admin" {
                        password "NokiaSros1!"
                        restricted-to-home false
                        access {
                            console true
                            netconf true
                            grpc true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                    user "clab" {
                        password "Containerlab1!"
                        access {
                            console true
                        }
                        console {
                            member ["administrative"]
                        }
                    }
                }
            }
        }
    }
